<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Ghi Chép Nhập Hàng</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }
        body {
            background-color: #f5f5f5;
            margin: 20px;
        }
        .toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border: 1px solid #c0c0c0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #d0d0d0;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background-color: #e6e6e6;
            color: #000;
            font-weight: bold;
            text-align: center;
            vertical-align: top;
        }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #e8f4fe; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: bold; }
        
        .filter-input {
            width: 100%;
            margin-top: 4px;
            padding: 3px 5px;
            font-size: 11px;
            font-weight: normal;
            border: 1px solid #aaa;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-add { background-color: #28a745; }
        .btn-add:hover { background-color: #218838; }
        
        .btn-upload { background-color: #17a2b8; }
        .btn-upload:hover { background-color: #138496; }

        .btn-action {
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 2px;
        }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-save { background-color: #007bff; color: white; display: none; }
        .editable-input { width: 100%; padding: 2px 4px; border: 1px solid #007bff; }
        
        #loading {
            display: none;
            font-weight: bold;
            color: #007bff;
            margin-left: 10px;
        }

        /* --- TÙY CHỈNH KÍCH THƯỚC VÀ KIỂU CỘT --- */
        .col-action { min-width: 80px; width: 80px; }
        .col-date { min-width: 110px; width: 110px; }
        .col-code { min-width: 110px; width: 120px; }
        .col-inv { min-width: 90px; width: 100px; }
        .col-vendor { min-width: 280px; white-space: normal; }
        .col-product-code { min-width: 120px; }
        .col-product-name { min-width: 250px; white-space: normal; }
        .col-unit { min-width: 60px; width: 60px; }
        .col-num { min-width: 100px; }
    </style>
</head>
<body>

    <h2>SỔ GHI CHÉP NHẬP HÀNG</h2>
    
    <div class="toolbar">
        <button class="btn btn-add" onclick="addRow()">+ Thêm dòng thủ công</button>
        <button class="btn btn-upload" onclick="document.getElementById('excelFile').click()">📥 Tải lên từ Excel</button>
        <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(this)">
        <span id="loading">⏳ Đang đồng bộ dữ liệu với Google Sheet...</span>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="col-action">Thao tác</th>
                    <th class="col-date">Ngày hạch toán<br><input type="text" class="filter-input" data-col="1" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-date">Ngày chứng từ<br><input type="text" class="filter-input" data-col="2" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-code">Số chứng từ<br><input type="text" class="filter-input" data-col="3" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-date">Ngày hóa đơn<br><input type="text" class="filter-input" data-col="4" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-inv">Số hóa đơn<br><input type="text" class="filter-input" data-col="5" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-vendor">Tên nhà cung cấp<br><input type="text" class="filter-input" data-col="6" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-product-code">Mã hàng<br><input type="text" class="filter-input" data-col="7" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-product-name">Tên hàng<br><input type="text" class="filter-input" data-col="8" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th class="col-unit">ĐVT</th>
                    <th class="col-num">Số lượng mua</th>
                    <th class="col-num">Đơn giá</th>
                    <th class="col-num">Giá trị mua</th>
                    <th class="col-num">Chiết khấu</th>
                    <th class="col-num">Số lượng trả lại</th>
                    <th class="col-num">Giá trị trả lại</th>
                    <th class="col-num">Giá trị giảm giá</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dữ liệu từ Google Sheet hiển thị ở đây -->
            </tbody>
        </table>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymskkZM2IzdEcDaRpVE_xFlYz9OESLt9YiVJ5yvYMuOQjb5D53i1GC3Nw_7izWXxiFOg/exec";

        window.onload = function() {
            loadDataFromSheet();
        };

        function showLoading(show) {
            document.getElementById("loading").style.display = show ? "inline" : "none";
        }

        // Tải dữ liệu từ Google Sheets
        function loadDataFromSheet() {
            showLoading(true);
            fetch(GOOGLE_SCRIPT_URL, {
                method: "GET",
                redirect: "follow"
            })
            .then(res => res.json())
            .then(data => {
                var tbody = document.getElementById("dataTable").getElementsByTagName('tbody')[0];
                tbody.innerHTML = "";
                if (Array.isArray(data)) {
                    data.forEach((row, index) => {
                        appendRowToTable(row, index);
                    });
                }
                showLoading(false);
            })
            .catch(err => {
                console.error("Lỗi khi tải dữ liệu:", err);
                showLoading(false);
            });
        }

        // Hàm chuyển đổi các dạng ngày về dd/mm/yyyy
        function formatDate(value) {
            if (!value) return '';
            
            if (typeof value === 'string' && value.includes('T')) {
                var dObj = new Date(value);
                if (!isNaN(dObj.getTime())) {
                    var d = dObj.getDate().toString().padStart(2, '0');
                    var m = (dObj.getMonth() + 1).toString().padStart(2, '0');
                    var y = dObj.getFullYear();
                    return `${d}/${m}/${y}`;
                }
            }

            if (value instanceof Date) {
                var d = value.getDate().toString().padStart(2, '0');
                var m = (value.getMonth() + 1).toString().padStart(2, '0');
                var y = value.getFullYear();
                return `${d}/${m}/${y}`;
            }

            if (typeof value === 'number' || (!isNaN(value) && Number(value) > 30000 && Number(value) < 60000)) {
                var num = Number(value);
                if (typeof XLSX !== 'undefined' && XLSX.SSF) {
                    var date = XLSX.SSF.parse_date_code(num);
                    if (date) {
                        var d = date.d.toString().padStart(2, '0');
                        var m = date.m.toString().padStart(2, '0');
                        var y = date.y;
                        return `${d}/${m}/${y}`;
                    }
                }
            }
            
            return value;
        }

        function appendRowToTable(row, index) {
            var tbody = document.getElementById("dataTable").getElementsByTagName('tbody')[0];
            var newRow = tbody.insertRow();
            
            // Gán chỉ số dòng trong Google Sheet (Index + 2 do dòng 1 là Tiêu đề)
            var sheetRowIndex = (index !== undefined && index !== null) ? (index + 2) : -1;
            newRow.setAttribute('data-sheet-row', sheetRowIndex);

            newRow.innerHTML = `
                <td class="text-center col-action">
                    <button class="btn-action btn-edit" onclick="editRow(this)">Sửa</button>
                    <button class="btn-action btn-save" onclick="saveRow(this)">Lưu</button>
                </td>
                <td class="text-center col-date">${formatDate(row[0])}</td>
                <td class="text-center col-date">${formatDate(row[1])}</td>
                <td class="col-code">${row[2] || ''}</td>
                <td class="text-center col-date">${formatDate(row[3])}</td>
                <td class="col-inv">${row[4] || ''}</td>
                <td class="col-vendor">${row[5] || ''}</td>
                <td class="col-product-code">${row[6] || ''}</td>
                <td class="col-product-name">${row[7] || ''}</td>
                <td class="text-center col-unit">${row[8] || ''}</td>
                <td class="text-right col-num">${row[9] !== undefined ? row[9] : ''}</td>
                <td class="text-right col-num">${row[10] !== undefined ? row[10] : ''}</td>
                <td class="text-right col-num">${row[11] !== undefined ? row[11] : ''}</td>
                <td class="col-num">${row[12] || ''}</td>
                <td class="col-num">${row[13] || ''}</td>
                <td class="col-num">${row[14] || ''}</td>
                <td class="col-num">${row[15] || ''}</td>
            `;
        }

        function editRow(btn) {
            var tr = btn.closest('tr');
            var cells = tr.querySelectorAll('td');
            for (var i = 1; i < cells.length; i++) {
                var currentText = cells[i].innerText;
                cells[i].innerHTML = `<input type="text" class="editable-input" value="${currentText.replace(/"/g, '&quot;')}">`;
            }
            tr.querySelector('.btn-edit').style.display = 'none';
            tr.querySelector('.btn-save').style.display = 'inline-block';
        }

function saveRow(btn) {
    if (event) event.preventDefault();

    var tr = btn.closest('tr');
    var cells = tr.querySelectorAll('td');
    var updatedData = [];

    // Thu thập dữ liệu từ các ô nhập
    for (var i = 1; i < cells.length; i++) {
        var input = cells[i].querySelector('input');
        var val = input ? input.value : cells[i].innerText;
        updatedData.push(val);
    }

    var sheetRowIndex = tr.getAttribute('data-sheet-row');

    showLoading(true);

    var isUpdate = (sheetRowIndex && sheetRowIndex !== "-1" && sheetRowIndex !== "null");

    var payload = JSON.stringify({
        action: isUpdate ? "updateRow" : "appendRows",
        rowIndex: parseInt(sheetRowIndex),
        rowData: updatedData,
        rows: [updatedData]
    });

    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: payload
    })
    .then(res => res.json())
    .then(data => {
        showLoading(false);
        
        // Cập nhật giá trị hiển thị trên bảng HTML (chuyển ô input thành chữ)
        for (var i = 1; i < cells.length; i++) {
            cells[i].innerText = updatedData[i - 1];
        }
        tr.querySelector('.btn-save').style.display = 'none';
        tr.querySelector('.btn-edit').style.display = 'inline-block';

        alert("Đã lưu thành công vào Google Sheet!");

        // Tải lại dữ liệu sau 3 giây để đồng bộ lại chỉ số dòng (sheetRowIndex)
        setTimeout(function() {
            loadDataFromSheet();
        }, 3000);
    })
    .catch(err => {
        console.error("Lỗi:", err);
        showLoading(false);
        // Ngay cả khi gặp chặn CORS do Google Redirect, dữ liệu vẫn đã được ghi vào Sheet thành công
        for (var i = 1; i < cells.length; i++) {
            cells[i].innerText = updatedData[i - 1];
        }
        tr.querySelector('.btn-save').style.display = 'none';
        tr.querySelector('.btn-edit').style.display = 'inline-block';
        
        alert("Đã gửi dữ liệu lưu vào Google Sheet!");
        setTimeout(function() {
            loadDataFromSheet();
        }, 3000);
    });
}

        function addRow() {
            var today = new Date();
            var d = today.getDate().toString().padStart(2, '0');
            var m = (today.getMonth() + 1).toString().padStart(2, '0');
            var y = today.getFullYear();
            var currentDateStr = `${d}/${m}/${y}`;

            // Tạo một dòng trắng tạm thời
            var emptyRow = [currentDateStr, currentDateStr, '', currentDateStr, '', '', '', '', 'Cái', 0, 0, 0, 0, 0, 0, 0];
            appendRowToTable(emptyRow, null);

            // Bật chế độ sửa ngay lập tức cho dòng mới tạo
            var tbody = document.getElementById("dataTable").getElementsByTagName('tbody')[0];
            var lastRow = tbody.rows[tbody.rows.length - 1];
            editRow(lastRow.querySelector('.btn-edit'));
        }

        function importExcel(input) {
            var file = input.files[0];
            if (!file) return;

            showLoading(true);
            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, {type: 'array', cellDates: true, dateNF: 'dd/mm/yyyy'});
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];
                
                var jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: true});
                var rowsToUpload = [];

                for (var i = 1; i < jsonData.length; i++) {
                    var row = jsonData[i];
                    if (!row || row.length === 0) continue;
                    var processedRow = [
                        formatDate(row[0]),
                        formatDate(row[1]),
                        row[2] || '',
                        formatDate(row[3]),
                        row[4] || '',
                        row[5] || '',
                        row[6] || '',
                        row[7] || '',
                        row[8] || '',
                        row[9] || '',
                        row[10] || '',
                        row[11] || '',
                        row[12] || '',
                        row[13] || '',
                        row[14] || '',
                        row[15] || ''
                    ];
                    rowsToUpload.push(processedRow);
                }

                var payload = JSON.stringify({ action: "appendRows", rows: rowsToUpload });

                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: payload
                })
                .then(() => {
                    showLoading(false);
                    alert("Đã tải dữ liệu thành công!");
                    setTimeout(loadDataFromSheet, 1500);
                })
                .catch(err => {
                    console.error("Lỗi khi tải dữ liệu:", err);
                    showLoading(false);
                    alert("Lỗi khi đồng bộ dữ liệu!");
                });

                input.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function filterTable() {
            var inputs = document.querySelectorAll('.filter-input');
            var table = document.getElementById("dataTable");
            var trs = table.querySelectorAll("tbody tr");

            trs.forEach(function(tr) {
                var showRow = true;
                inputs.forEach(function(input) {
                    var colIndex = parseInt(input.getAttribute('data-col'));
                    var filterValue = input.value.toLowerCase().trim();
                    var cellText = tr.cells[colIndex] ? tr.cells[colIndex].innerText.toLowerCase() : '';

                    if (filterValue !== "" && cellText.indexOf(filterValue) === -1) {
                        showRow = false;
                    }
                });
                tr.style.display = showRow ? "" : "none";
            });
        }
    </script>
</body>
</html>
