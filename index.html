<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhập Kho Dữ Liệu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS cho Đọc Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 70vh; overflow-y: auto; }
        th { background-color: #0d6efd !important; color: white !important; position: sticky; top: 0; z-index: 10; white-space: nowrap; }
        td { vertical-align: middle; white-space: nowrap; }
        .editable-input { width: 100%; min-width: 100px; padding: 2px 5px; border: 1px solid #0d6efd; border-radius: 4px; }
        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="loadingSpinner">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Đang xử lý...</span>
    </div>
</div>

<div class="container-fluid my-4">
    <div class="table-container">
        <h3 class="mb-4 text-primary"><i class="fa-solid fa-boxes-packing me-2"></i>Quản Lý Dữ Liệu Nhập Kho</h3>
        
        <!-- Nút Thao Tác -->
        <div class="row mb-3">
            <div class="col-md-6 d-flex gap-2">
                <button class="btn btn-success" onclick="addRow()"><i class="fa-solid fa-plus me-1"></i>Thêm Dòng</button>
                <button class="btn btn-primary" onclick="loadDataFromSheet()"><i class="fa-solid fa-rotate me-1"></i>Tải Lại Dữ Liệu</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end gap-2">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
                <button class="btn btn-outline-success" onclick="document.getElementById('excelFileInput').click()">
                    <i class="fa-solid fa-file-excel me-1"></i>Nhập Từ Excel
                </button>
            </div>
        </div>

        <!-- Bảng Dữ Liệu -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle" id="dataTable">
                <thead>
                    <tr>
                        <th class="text-center">Thao Tác</th>
                        <th>Ngày HT</th>
                        <th>Ngày CT</th>
                        <th>Số CT</th>
                        <th>Ngày Hạn TT</th>
                        <th>Mã NCC</th>
                        <th>Tên NCC</th>
                        <th>Diễn Giải</th>
                        <th>Mã Hàng</th>
                        <th>ĐVT</th>
                        <th>Số Lượng</th>
                        <th>Đơn Giá</th>
                        <th>Thành Tiền</th>
                        <th>CK (%)</th>
                        <th>Tiền CK</th>
                        <th>Chi Phí</th>
                        <th>Giá Trị Giảm</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dữ liệu render tại đây -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ⚠️ ĐỔI THÀNH URL WEB APP CỦA BẠN
    const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    document.addEventListener("DOMContentLoaded", function() {
        loadDataFromSheet();
    });

    function showLoading(show) {
        document.getElementById('loadingSpinner').style.display = show ? 'flex' : 'none';
    }

    // 1. Tải dữ liệu từ Google Sheet
    function loadDataFromSheet() {
        showLoading(true);
        fetch(GOOGLE_SCRIPT_URL, {
            method: "GET",
            redirect: "follow"
        })
        .then(res => res.json())
        .then(data => {
            showLoading(false);
            if (data.result === "success") {
                renderTable(data.data);
            } else {
                alert("Lỗi tải dữ liệu: " + data.error);
            }
        })
        .catch(err => {
            showLoading(false);
            console.error("Lỗi kết nối:", err);
            alert("Không thể kết nối đến máy chủ Google Apps Script.");
        });
    }

    // 2. Hiển thị bảng
    function renderTable(rows) {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        rows.forEach(function(row, index) {
            appendRowToTable(row, index);
        });
    }

    function appendRowToTable(rowData, index) {
        var tbody = document.getElementById('tableBody');
        var tr = document.createElement('tr');
        
        // Tính toán đúng chỉ số dòng trên Google Sheet (Dòng 1 là Tiêu đề => Index 0 là Dòng 2)
        var sheetRowIndex = (index !== undefined && index !== null) ? (index + 2) : -1;
        tr.setAttribute('data-sheet-row', sheetRowIndex);

        var actionTd = `<td class="text-center">
            <button class="btn btn-sm btn-warning btn-edit" onclick="editRow(this)"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="btn btn-sm btn-success btn-save" onclick="saveRow(this)" style="display:none;"><i class="fa-solid fa-floppy-disk"></i></button>
        </td>`;

        var cellsHtml = actionTd;
        for (var i = 0; i < 16; i++) {
            var val = (rowData && rowData[i] !== undefined) ? rowData[i] : '';
            // Định dạng ngày tháng nếu là ISO String từ Sheet
            if (typeof val === 'string' && val.includes('T00:00:00')) {
                val = val.split('T')[0];
            }
            cellsHtml += `<td>${val}</td>`;
        }

        tr.innerHTML = cellsHtml;
        tbody.appendChild(tr);
        return tr;
    }

    // 3. Thêm dòng trống mới
    function addRow() {
        var now = new Date();
        var currentDateStr = now.toISOString().split('T')[0];

        // Khởi tạo mảng đúng 16 cột dữ liệu
        var emptyRow = [currentDateStr, currentDateStr, '', currentDateStr, '', '', '', '', 'Cái', 0, 0, 0, 0, 0, 0, 0];
        var newRow = appendRowToTable(emptyRow, null);
        
        // Tự động chuyển sang chế độ chỉnh sửa dòng vừa tạo
        editRow(newRow.querySelector('.btn-edit'));
    }

    // 4. Bật chế độ sửa dòng
    function editRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');

        // Bỏ qua cột 0 (Cột Thao Tác)
        for (var i = 1; i < cells.length; i++) {
            var currentText = cells[i].innerText.trim();
            cells[i].innerHTML = `<input type="text" class="editable-input" value="${currentText}">`;
        }

        tr.querySelector('.btn-edit').style.display = 'none';
        tr.querySelector('.btn-save').style.display = 'inline-block';
    }

    // 5. Lưu dòng (Tạo mới hoặc Cập nhật)
    function saveRow(btn) {
        if (event) event.preventDefault();

        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var updatedData = [];

        // Lấy dữ liệu từ các input (Cột 1 đến 16)
        for (var i = 1; i < cells.length; i++) {
            var input = cells[i].querySelector('input');
            var val = input ? input.value.trim() : cells[i].innerText.trim();
            updatedData.push(val);
        }

        var sheetRowIndex = tr.getAttribute('data-sheet-row');
        var isUpdate = (sheetRowIndex && sheetRowIndex !== "-1" && sheetRowIndex !== "null");

        var payload = JSON.stringify({
            action: isUpdate ? "updateRow" : "appendRows",
            rowIndex: parseInt(sheetRowIndex),
            rowData: updatedData,
            rows: [updatedData] // Bọc trong mảng 2 chiều cho cả trường hợp append
        });

        showLoading(true);

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: payload,
            redirect: "follow" // BẮT BUỘC PHẢI CÓ
        })
        .then(res => res.json())
        .then(data => {
            showLoading(false);
            if (data.result === "success") {
                // Đổi hiển thị giao diện về dạng text thường
                for (var i = 1; i < cells.length; i++) {
                    cells[i].innerText = updatedData[i - 1];
                }
                tr.querySelector('.btn-save').style.display = 'none';
                tr.querySelector('.btn-edit').style.display = 'inline-block';
                
                alert("Đã lưu dữ liệu thành công!");
                
                // Tải lại bảng để làm mới các chỉ số dòng (Row Index) từ Google Sheet
                loadDataFromSheet();
            } else {
                alert("Lỗi từ Google Apps Script: " + data.error);
            }
        })
        .catch(err => {
            showLoading(false);
            console.error("Lỗi khi gửi yêu cầu:", err);
            
            // Xử lý fallback cho giao diện
            for (var i = 1; i < cells.length; i++) {
                cells[i].innerText = updatedData[i - 1];
            }
            tr.querySelector('.btn-save').style.display = 'none';
            tr.querySelector('.btn-edit').style.display = 'inline-block';

            alert("Đã gửi thông tin lưu! Đang cập nhật lại danh sách...");
            setTimeout(loadDataFromSheet, 1500);
        });
    }

    // 6. Nhập hàng loạt từ Excel
    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });

            var firstSheetName = workbook.SheetNames[0];
            var worksheet = workbook.Sheets[firstSheetName];

            // Đọc từ dòng thứ 2 (bỏ qua tiêu đề tiêu chuẩn)
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            var rowsToAppend = excelData.slice(1).filter(r => r.length > 0);

            if (rowsToAppend.length === 0) {
                alert("File Excel trống hoặc không đúng định dạng!");
                return;
            }

            // Đảm bảo mỗi dòng có đủ 16 cột
            rowsToAppend = rowsToAppend.map(row => {
                var newRow = [];
                for (var i = 0; i < 16; i++) {
                    newRow.push(row[i] !== undefined ? row[i] : '');
                }
                return newRow;
            });

            showLoading(true);

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "appendRows",
                    rows: rowsToAppend
                }),
                redirect: "follow"
            })
            .then(res => res.json())
            .then(data => {
                showLoading(false);
                if (data.result === "success") {
                    alert(`Đã nhập thành công ${rowsToAppend.length} dòng từ Excel!`);
                    loadDataFromSheet();
                } else {
                    alert("Lỗi nhập Excel: " + data.error);
                }
            })
            .catch(err => {
                showLoading(false);
                console.error("Lỗi:", err);
                alert("Đã gửi file Excel! Đang cập nhật dữ liệu...");
                setTimeout(loadDataFromSheet, 2000);
            });
        };
        reader.readAsArrayBuffer(file);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
