<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Ghi Chép Nhập Hàng</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }
        body {
            background-color: #f5f5f5;
            margin: 20px;
        }
        .toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border: 1px solid #c0c0c0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #d0d0d0;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background-color: #e6e6e6;
            color: #000;
            font-weight: bold;
            text-align: center;
            vertical-align: top;
        }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #e8f4fe; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: bold; }
        
        .filter-input {
            width: 100%;
            margin-top: 4px;
            padding: 3px 5px;
            font-size: 11px;
            font-weight: normal;
            border: 1px solid #aaa;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-add { background-color: #28a745; }
        .btn-add:hover { background-color: #218838; }
        
        .btn-upload { background-color: #17a2b8; }
        .btn-upload:hover { background-color: #138496; }

        .btn-action {
            padding: 3px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 2px;
        }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-save { background-color: #007bff; color: white; display: none; }
        .editable-input { width: 100%; padding: 2px 4px; border: 1px solid #007bff; }
        
        #loading {
            display: none;
            font-weight: bold;
            color: #007bff;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <h2>SỔ GHI CHÉP NHẬP HÀNG</h2>
    
    <div class="toolbar">
        <button class="btn btn-add" onclick="addRow()">+ Thêm dòng thủ công</button>
        <button class="btn btn-upload" onclick="document.getElementById('excelFile').click()">📥 Tải lên từ Excel</button>
        <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(this)">
        <span id="loading">⏳ Đang đồng bộ dữ liệu với Google Sheet...</span>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 90px;">Thao tác</th>
                    <th>Ngày hạch toán<br><input type="text" class="filter-input" data-col="1" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Ngày chứng từ<br><input type="text" class="filter-input" data-col="2" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Số chứng từ<br><input type="text" class="filter-input" data-col="3" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Ngày hóa đơn<br><input type="text" class="filter-input" data-col="4" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Số hóa đơn<br><input type="text" class="filter-input" data-col="5" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Tên nhà cung cấp<br><input type="text" class="filter-input" data-col="6" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Mã hàng<br><input type="text" class="filter-input" data-col="7" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>Tên hàng<br><input type="text" class="filter-input" data-col="8" placeholder="🔍 Lọc..." onkeyup="filterTable()"></th>
                    <th>ĐVT</th>
                    <th>Số lượng mua</th>
                    <th>Đơn giá</th>
                    <th>Giá trị mua</th>
                    <th>Chiết khấu</th>
                    <th>Số lượng trả lại</th>
                    <th>Giá trị trả lại</th>
                    <th>Giá trị giảm giá</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dữ liệu từ Google Sheet hiển thị ở đây -->
            </tbody>
        </table>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZT0TI69GZp0zphQgSh_MvicnNIvUtup59ucD-0vqrl-SpOGFcK7DT0h0TmEuDcw5Mdg/exec";

        window.onload = function() {
            loadDataFromSheet();
        };

        function showLoading(show) {
            document.getElementById("loading").style.display = show ? "inline" : "none";
        }

        // Tải dữ liệu từ Google Sheets về hiển thị
        function loadDataFromSheet() {
            showLoading(true);
            fetch(GOOGLE_SCRIPT_URL, {
                method: "GET",
                redirect: "follow"
            })
            .then(res => res.json())
            .then(data => {
                var tbody = document.getElementById("dataTable").getElementsByTagName('tbody')[0];
                tbody.innerHTML = "";
                if (Array.isArray(data)) {
                    data.forEach(row => {
                        appendRowToTable(row);
                    });
                }
                showLoading(false);
            })
            .catch(err => {
                console.error("Lỗi khi tải dữ liệu:", err);
                showLoading(false);
            });
        }

        function appendRowToTable(row) {
            var tbody = document.getElementById("dataTable").getElementsByTagName('tbody')[0];
            var newRow = tbody.insertRow();
            newRow.innerHTML = `
                <td class="text-center">
                    <button class="btn-action btn-edit" onclick="editRow(this)">Sửa</button>
                    <button class="btn-action btn-save" onclick="saveRow(this)">Lưu</button>
                </td>
                <td class="text-center">${row[0] || ''}</td>
                <td class="text-center">${row[1] || ''}</td>
                <td>${row[2] || ''}</td>
                <td class="text-center">${row[3] || ''}</td>
                <td>${row[4] || ''}</td>
                <td>${row[5] || ''}</td>
                <td>${row[6] || ''}</td>
                <td>${row[7] || ''}</td>
                <td class="text-center">${row[8] || ''}</td>
                <td class="text-right">${row[9] || ''}</td>
                <td class="text-right">${row[10] || ''}</td>
                <td class="text-right">${row[11] || ''}</td>
                <td>${row[12] || ''}</td>
                <td>${row[13] || ''}</td>
                <td>${row[14] || ''}</td>
                <td>${row[15] || ''}</td>
            `;
        }

        function formatDate(value) {
            if (!value) return '';
            if (value instanceof Date) {
                var d = value.getDate().toString().padStart(2, '0');
                var m = (value.getMonth() + 1).toString().padStart(2, '0');
                var y = value.getFullYear();
                return `${d}/${m}/${y}`;
            }
            if (typeof value === 'number' || !isNaN(value)) {
                var num = Number(value);
                if (num > 30000 && num < 60000) {
                    var date = XLSX.SSF.parse_date_code(num);
                    if (date) {
                        var d = date.d.toString().padStart(2, '0');
                        var m = date.m.toString().padStart(2, '0');
                        var y = date.y;
                        return `${d}/${m}/${y}`;
                    }
                }
            }
            return value;
        }

        // Tải Excel lên và gửi dữ liệu lưu thẳng vào Google Sheet
        function importExcel(input) {
            var file = input.files[0];
            if (!file) return;

            showLoading(true);
            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, {type: 'array', cellDates: true, dateNF: 'dd/mm/yyyy'});
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];
                
                var jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: true});
                var rowsToUpload = [];

                for (var i = 1; i < jsonData.length; i++) {
                    var row = jsonData[i];
                    if (!row || row.length === 0) continue;
                    var processedRow = [
                        formatDate(row[0]),
                        formatDate(row[1]),
                        row[2] || '',
                        formatDate(row[3]),
                        row[4] || '',
                        row[5] || '',
                        row[6] || '',
                        row[7] || '',
                        row[8] || '',
                        row[9] || '',
                        row[10] || '',
                        row[11] || '',
                        row[12] || '',
                        row[13] || '',
                        row[14] || '',
                        row[15] || ''
                    ];
                    rowsToUpload.push(processedRow);
                }

                var payload = JSON.stringify({ action: "appendRows", rows: rowsToUpload });

                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain"
                    },
                    body: payload
                })
                .then(() => {
                    showLoading(false);
                    alert("Đã gửi dữ liệu thành công! Đang tải lại danh sách...");
                    setTimeout(loadDataFromSheet, 2000);
                })
                .catch(err => {
                    console.error("Lỗi khi tải dữ liệu:", err);
                    showLoading(false);
                    alert("Lỗi khi đồng bộ dữ liệu!");
                });

                input.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // Lọc dữ liệu
        function filterTable() {
            var inputs = document.querySelectorAll('.filter-input');
            var table = document.getElementById("dataTable");
            var trs = table.querySelectorAll("tbody tr");

            trs.forEach(function(tr) {
                var showRow = true;
                inputs.forEach(function(input) {
                    var colIndex = parseInt(input.getAttribute('data-col'));
                    var filterValue = input.value.toLowerCase().trim();
                    var cellText = tr.cells[colIndex] ? tr.cells[colIndex].innerText.toLowerCase() : '';

                    if (filterValue !== "" && cellText.indexOf(filterValue) === -1) {
                        showRow = false;
                    }
                });
                tr.style.display = showRow ? "" : "none";
            });
        }

        function editRow(btn) {
            var tr = btn.closest('tr');
            var cells = tr.querySelectorAll('td');
            for (var i = 1; i < cells.length; i++) {
                var currentText = cells[i].innerText;
                cells[i].innerHTML = `<input type="text" class="editable-input" value="${currentText}">`;
            }
            tr.querySelector('.btn-edit').style.display = 'none';
            tr.querySelector('.btn-save').style.display = 'inline-block';
        }

        function saveRow(btn) {
            var tr = btn.closest('tr');
            var cells = tr.querySelectorAll('td');
            for (var i = 1; i < cells.length; i++) {
                var input = cells[i].querySelector('input');
                if (input) cells[i].innerText = input.value;
            }
            tr.querySelector('.btn-save').style.display = 'none';
            tr.querySelector('.btn-edit').style.display = 'inline-block';
            filterTable();
        }

        function addRow() {
            appendRowToTable(['---', '---', '---', '---', '---', '---', '---', '---', 'Cái', 0, 0, 0, '', '', '', '']);
        }
    </script>
</body>
</html>
