<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Dữ Liệu Bán Hàng & Nhập Kho - Tabulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important; 
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 15px;
        }

        .table-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        #example-table {
            flex: 1 1 auto;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        #loadingSpinner { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255,255,255,0.85); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center; 
        }

        .filter-card { 
            background: #eef2f7; 
            border-radius: 6px; 
            padding: 10px 15px; 
            margin-bottom: 10px; 
            border: 1px solid #cbd5e1;
            flex-shrink: 0;
        }

        .view-mode-btn-group .btn { font-weight: 600; font-size: 0.95rem; }
        .view-mode-btn-group .btn.active { box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }
        
        /* Tùy chỉnh giao diện Tabulator cho hiện đại */
        .tabulator {
            font-size: 1.2rem;
        }
        <style>
    /* Cho phép tiêu đề cột Tabulator tự động xuống dòng và tự co giãn chiều cao */
    .tabulator .tabulator-header .tabulator-col {
        white-space: normal !important;
        word-wrap: break-word !important;
        vertical-align: middle !important;
    }
    
    .tabulator .tabulator-header .tabulator-col-content {
        padding: 4px !important;
    }

    .tabulator .tabulator-header .tabulator-col-title {
        white-space: normal !important;
        text-overflow: clip !important;
        line-height: 1.25;
    }
</style>
    </style>
</head>
<body>

<!-- Loading Spinner -->
<div id="loadingSpinner">
    <div class="text-center">
        <div class="spinner-border text-primary" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
        <div class="mt-2 fw-bold text-dark" id="spinnerText">Đang nạp dữ liệu từ Google Sheets...</div>
    </div>
</div>

<div class="container-fluid p-2 h-100">
    <div class="table-container">

                <button type="button" id="btnModeNhapKho" class="btn btn-outline-primary" onclick="switchTableMode('NHAP_KHO')">

                    <i class="fa-solid fa-file-invoice-dollar me-1"></i> BÁO GIÁ LENOVO
                </button>
            </div>

            <span class="badge bg-info text-dark fs-6" id="rowCountBadge">Hiển thị: 0 dòng</span>
        </div>

        <!-- BỘ LỌC TOÀN CỤC PHÍA TRÊN -->
        <div class="filter-card">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <label class="form-label fw-bold mb-0 small"><i class="fa-solid fa-magnifying-glass me-1"></i>Tìm kiếm nhanh toàn bảng:</label>
                    <input type="text" id="globalSearchInput" class="form-control form-control-sm fs-6" placeholder="Nhập từ khóa bất kỳ..." onkeyup="applyGlobalSearch()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-0 small"><i class="fa-solid fa-user me-1"></i>Khách hàng / NCC / Mã:</label>

                    <button class="btn btn-sm btn-secondary w-100" onclick="resetAllFilters()"><i class="fa-solid fa-rotate-left me-1"></i>Xóa bộ lọc</button>
                </div>
            </div>
        </div>
        
        <!-- NÚT THAO TÁC -->

            <div class="col-md-6 d-flex gap-2">
                <button class="btn btn-sm btn-success" onclick="addRow()"><i class="fa-solid fa-plus me-1"></i>Thêm Dòng Mới</button>
                <button class="btn btn-sm btn-primary" onclick="loadDataFromSheet()"><i class="fa-solid fa-rotate me-1"></i>Tải Lại Sheet Này</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end gap-2">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">

                    <i class="fa-solid fa-file-excel me-1"></i>Nhập Từ Excel Vào Sheet Này
                </button>

        </div>

    </div>
</div>

            { label: 'TÊN SẢN PHẨM', desc: true }, { label: 'GIÁ TIỀN MẶT', numeric: true },

            { label: 'TÊN SẢN PHẨM', desc: true }, { label: 'GIÁ TIỀN MẶT', numeric: true },

    let currentMode = 'LAPTOP';
    let table = null;

    function getActiveColumns() { return SHEET_CONFIGS[currentMode] || []; }

    function switchTableMode(mode) {
        currentMode = mode;
        
        document.querySelectorAll('.view-mode-btn-group .btn').forEach(btn => {
            btn.className = 'btn ' + btn.className.replace(/btn-(warning|dark|danger|secondary|success|primary|info)/g, 'btn-outline-\$1').replace('active', '').trim();
        });
        
        let btnObj = {
            'LAPTOP': { id: 'btnModeLaptop', cls: 'btn-warning' },
            'PC': { id: 'btnModePc', cls: 'btn-dark' },
            'LCD': { id: 'btnModeLcd', cls: 'btn-danger' },
            'AIO': { id: 'btnModeAio', cls: 'btn-secondary' },
            'BAN_HANG': { id: 'btnModeBanHang', cls: 'btn-success' },
            'NHAP_KHO': { id: 'btnModeNhapKho', cls: 'btn-primary' },
            'TON_KHO': { id: 'btnModeTonKho', cls: 'btn-info' },
            'BANG_GIA_DELL': { id: 'btnModeBaoGia1', cls: 'btn-warning' },
            'BANG_GIA_HP': { id: 'btnModeBaoGia2', cls: 'btn-warning' },
            'BANG_GIA_LENOVO': { id: 'btnModeBaoGia3', cls: 'btn-warning' }
        }[mode];

        if (btnObj) {
            let targetBtn = document.getElementById(btnObj.id);
            if (targetBtn) targetBtn.className = `btn ${btnObj.cls} active`;
        }
        
        let cols = getActiveColumns();
        document.getElementById('modeDescription').innerText = `Đang hiển thị Trang tính: ${mode} (${cols.length} Cột)`;
        
        resetAllFilters(false);
        loadDataFromSheet();
    }

    function showLoading(show, text = "Đang nạp dữ liệu từ Google Sheets...") {
        document.getElementById('loadingSpinner').style.display = show ? 'flex' : 'none';
        document.getElementById('spinnerText').innerText = text;
    }

    function loadDataFromSheet() {
        showLoading(true, `Đang tải dữ liệu Sheet ${currentMode}...`);

        fetch(`${GOOGLE_SCRIPT_URL}?action=getData&sheetName=${currentMode}`)
            .then(res => res.json())
            .then(data => {
                buildTabulatorTable(data);
                showLoading(false);
            })
            .catch(err => {
                showLoading(false);
                alert("Lỗi kết nối đến Google Sheets!");
            });
    }

    function buildTabulatorTable(rawData) {
        if (!rawData || rawData.length === 0) {
            if (table) table.clearData();
            return;
        }

        let activeCols = getActiveColumns();
        
        // Định nghĩa cột thao tác (Sửa trực tiếp trên bảng Tabulator)
        let columnsConfig = [
            {
                formatter: "rownum", 
                hozAlign: "center", 
                width: 60, 
                headerSort: false, 
                frozen: true,
                title: "STT"
            },
            {
                formatter: function(cell) {
                    return `<button class="btn btn-sm btn-outline-primary py-0 px-1" title="Sửa nhanh"><i class="fa-solid fa-pen"></i></button>`;
                },
                width: 65,
                hozAlign: "center",
                headerSort: false,
                frozen: true,
                cellClick: function(e, cell) {
                    let row = cell.getRow();
                    row.normalizeHeight();
                    // Cho phép chỉnh sửa trực tiếp các ô trong dòng
                }
            }
        ];

        // Tạo cấu hình từng cột kết hợp headerFilter kiểu Excel (list + multiselect)
// Thay thế phần cấu hình cột cũ bằng đoạn này:
// Thay thế đoạn cấu hình colDef cũ bằng đoạn này:
        activeCols.forEach((col, index) => {
            let colDef = {
                title: col.label,
                field: "col_" + index,
                // Ưu tiên lấy width bạn định nghĩa trong SHEET_CONFIGS, nếu không có thì tự động co giãn theo dữ liệu (fitData)
                width: col.width || undefined, 
                minWidth: 80, // Đặt chiều rộng tối thiểu để không bị bóp quá nhỏ
                editor: "input", 
                headerFilter: "input", 
                headerFilterFunc: "like", 
                headerFilterPlaceholder: "Lọc..."
            };

if (col.numeric) {
                colDef.hozAlign = "right";
                colDef.formatter = function(cell) {
                    let val = cell.getValue();
                    if (val === null || val === undefined || val === '') return '';
                    if (col.percent) {
                        let cleanVal = String(val).replace('%', '').trim();
                        let num = parseFloat(cleanVal);
                        if (isNaN(num)) return val;
                        return num > 1 ? num.toFixed(2) + '%' : (num * 100).toFixed(2) + '%';
                    }
                    let num = parseFloat(String(val).replace(/[,.]/g, ''));
                    return isNaN(num) ? val : num.toLocaleString('vi-VN');
                };
            } else if (col.date) {
                colDef.hozAlign = "center";
                colDef.formatter = function(cell) {
                    let val = cell.getValue();
                    if (!val) return '';
                    
                    // Xử lý chuyển đổi ngày tháng chuẩn kiểu Việt Nam
                    let d = new Date(val);
                    if (typeof val === 'string' && val.includes('T')) {
                        return !isNaN(d.getTime()) ? d.toLocaleDateString('vi-VN') : val;
                    } else if (!isNaN(d.getTime()) && isNaN(val)) {
                        return d.toLocaleDateString('vi-VN');
                    }
                    return val;
                };
            }

            columnsConfig.push(colDef);
        });

        // Chuyển đổi dữ liệu thô thành định dạng đối tượng của Tabulator
        let tableData = rawData.slice(1).map((row, rowIndex) => {
            let obj = { sheetRowIndex: rowIndex + 2 };
            activeCols.forEach((col, index) => {
                obj["col_" + index] = row[index] !== undefined && row[index] !== null ? row[index] : '';
            });
            return obj;
        });

        if (table) {
            table.destroy();
        }

        table = new Tabulator("#example-table", {
            data: tableData,
            layout: "fitData",
            responsiveLayout: false,
            height: "100%",
            columns: columnsConfig,
            pagination: "local",
            paginationSize: 50,
            paginationSizeSelector: [25, 50, 100, 200, 500],
            movableColumns: true,
            columnDefaults: {
                resizable: true,
            },
        });

        table.on("dataFiltered", function(filters, rows){
            document.getElementById('rowCountBadge').innerText = `Hiển thị: ${rows.length} / ${tableData.length} dòng`;
        });

        table.on("tableBuilt", function() {
            document.getElementById('rowCountBadge').innerText = `Hiển thị: ${tableData.length} / ${tableData.length} dòng`;
        });

        // Lắng nghe sự kiện chỉnh sửa ô để cập nhật ngược lại Google Sheets nếu muốn
        table.on("cellEdited", function(cell){
            let rowData = cell.getRow().getData();
            let sheetRowIndex = rowData.sheetRowIndex;
            let fullRowData = [];
            for(let i = 0; i < activeCols.length; i++) {
                fullRowData.push(rowData["col_" + i]);
            }
            saveRowToSheet(sheetRowIndex, fullRowData);
        });
    }

    function applyGlobalSearch() {
        if (!table) return;
        let kw = document.getElementById('globalSearchInput').value.toLowerCase();
        let kwCus = document.getElementById('customerFilterInput').value.toLowerCase();

        table.setFilter(function(data){
            let matchGlobal = true;
            let matchCus = true;

            if (kw) {
                matchGlobal = Object.values(data).some(val => String(val).toLowerCase().includes(kw));
            }

            if (kwCus) {
                matchCus = Object.entries(data).some(([key, val]) => {
                    if (key.startsWith('col_')) {
                        let idx = parseInt(key.replace('col_', ''));
                        let col = getActiveColumns()[idx];
                        if (col && (col.customer || col.ncc || col.code)) {
                            return String(val).toLowerCase().includes(kwCus);
                        }
                    }
                    return false;
                });
            }

            return matchGlobal && matchCus;
        });
    }

    function resetAllFilters(reload = true) {
        document.getElementById('globalSearchInput').value = '';
        document.getElementById('customerFilterInput').value = '';
        if (table) {
            table.clearFilter(true);
            table.clearHeaderFilter();
        }
    }

    function saveRowToSheet(sheetRowIndex, fullRowData) {
        showLoading(true, `Đang ghi dữ liệu vào Sheet '${currentMode}'...`);
        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "updateRow",
            sheetName: currentMode,
            rowIndex: sheetRowIndex,
            rowData: fullRowData
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
            }, 800);
        })
        .catch(err => {
            showLoading(false);
            alert("Lỗi lưu dữ liệu!");
        });
    }

    function addRow() {
        var activeCols = getActiveColumns();
        var emptyRow = new Array(activeCols.length).fill('');

        showLoading(true, `Đang thêm dòng mới vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "appendRows",
            sheetName: currentMode,
            rows: [emptyRow]
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                loadDataFromSheet();
            }, 1000);
        });
    }

    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var activeCols = getActiveColumns();
        var reader = new FileReader();
        reader.onload = async function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });
            var worksheet = workbook.Sheets[workbook.SheetNames[0]];
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            var rawRows = excelData.slice(1).filter(r => r.length > 0 && r.some(cell => cell !== null && cell !== ''));
            if (rawRows.length === 0) {
                alert("File Excel không chứa dữ liệu!");
                return;
            }

            var formattedRows = rawRows.map(row => {
                var newRow = [];
                for (var i = 0; i < activeCols.length; i++) {
                    var cellVal = row[i] !== undefined && row[i] !== null ? row[i] : '';
                    newRow.push(String(cellVal));
                }
                return newRow;
            });

            showLoading(true, `Đang đẩy ${formattedRows.length} dòng vào Sheet '${currentMode}'...`);
            
            var formData = new URLSearchParams();
            formData.append("payload", JSON.stringify({
                action: "appendRows",
                sheetName: currentMode,
                rows: formattedRows
            }));

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData.toString()
                });
            } catch (err) {}

            setTimeout(() => {
                showLoading(false);
                alert(`Đã hoàn tất tải lên file Excel vào Sheet '${currentMode}'!`);
                loadDataFromSheet();
            }, 1500);

            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }

    window.onload = function() {
        loadDataFromSheet();
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
