<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích Sản Phẩm, Giá Bán & Quản Lý Kho Tồn</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS đọc file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 62vh; overflow-y: auto; }
        
        /* Header bảng tông màu vàng xám nổi bật */
        th { 
            background-color: #ffc107 !important; 
            color: #212529 !important; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            white-space: nowrap; 
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        td { vertical-align: middle; white-space: nowrap; font-size: 0.85rem; }
        
        .editable-input { width: 100%; min-width: 80px; padding: 2px 5px; border: 1px solid #0d6efd; border-radius: 4px; font-size: 0.85rem; }
        .filter-input { width: 100%; min-width: 70px; padding: 2px 5px; font-size: 0.8rem; border-radius: 4px; border: 1px solid #ced4da; }
        
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.75); z-index: 9999; justify-content: center; align-items: center; }
        .filter-card { background: #eef2f7; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        
        /* CSS Phân trang */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }

        .view-mode-btn-group .btn {
            font-weight: 600;
        }
        .view-mode-btn-group .btn.active {
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<!-- Màn hình chờ kết nối API -->
<div id="loadingSpinner">
    <div class="text-center">
        <div class="spinner-border text-warning" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
        <div class="mt-2 fw-bold text-dark" id="spinnerText">Đang đồng bộ dữ liệu với Google Sheets...</div>
    </div>
</div>

<div class="container-fluid my-3">
    <div class="table-container">
        
        <!-- HEADER TRANG & NÚT CHUYỂN ĐỔI BẢNG -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div>
                <h4 class="text-dark fw-bold m-0"><i class="fa-solid fa-boxes-stacked text-warning me-2"></i>Hệ Thống Phân Tích & Quản Lý Kho Tồn</h4>
                <small class="text-muted" id="modeDescription">Đang hiển thị: Danh Sách Máy Tính Xách Tay (Laptop - 31 Cột)</small>
            </div>
            
            <!-- NÚT CHUYỂN CHẾ ĐỘ XEM BẢNG (LAPTOP / PC / KHO TỒN MỖI NGÀY) -->
            <div class="btn-group view-mode-btn-group" role="group">
                <button type="button" id="btnModeFull" class="btn btn-warning active" onclick="switchTableMode('FULL')">
                    <i class="fa-solid fa-laptop me-1"></i> Phân Tích Laptop (31 Cột)
                </button>
                <button type="button" id="btnModePrice" class="btn btn-outline-dark" onclick="switchTableMode('PRICE')">
                    <i class="fa-solid fa-desktop me-1"></i> Phân Tích PC (23 Cột)
                </button>
                <button type="button" id="btnModeInventory" class="btn btn-outline-info" onclick="switchTableMode('INVENTORY')">
                    <i class="fa-solid fa-warehouse me-1"></i> Kho Tồn Mỗi Ngày (10 Cột)
                </button>
            </div>

            <span class="badge bg-dark fs-6" id="rowCountBadge">Hiển thị: 0 / 0 dòng</span>
        </div>

        <!-- BỘ LỌC TÌM KIẾM NÂNG CAO -->
        <div class="filter-card">
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-magnifying-glass me-1"></i>Tìm kiếm nhanh:</label>
                    <input type="text" id="globalSearchInput" class="form-control form-control-sm" placeholder="Nhập Tên hàng, SKU, Mã KTB..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-layer-group me-1"></i>Loại hàng / Brand:</label>
                    <input type="text" id="brandFilterInput" class="form-control form-control-sm" placeholder="Adapter, DDRAM, Dell..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-truck-field me-1"></i>Nhà cung cấp (NCC):</label>
                    <input type="text" id="nccFilterInput" class="form-control form-control-sm" placeholder="Nhập tên NCC..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-barcode me-1"></i>Mã Hàng / Mã KTB / SKU:</label>
                    <input type="text" id="codeFilterInput" class="form-control form-control-sm" placeholder="Nhập mã hàng hoá..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-sm btn-secondary w-100 mt-3" onclick="resetFilters()"><i class="fa-solid fa-rotate-left me-1"></i>Xóa bộ lọc</button>
                </div>
            </div>
        </div>
        
        <!-- NÚT THAO TÁC -->
        <div class="row mb-3">
            <div class="col-md-6 d-flex gap-2">
                <button class="btn btn-sm btn-success" onclick="addRow()"><i class="fa-solid fa-plus me-1"></i>Thêm Sản Phẩm</button>
                <button class="btn btn-sm btn-primary" onclick="loadDataFromSheet()"><i class="fa-solid fa-rotate me-1"></i>Tải Lại Google Sheets</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end gap-2">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
                <button class="btn btn-sm btn-outline-success" onclick="document.getElementById('excelFileInput').click()">
                    <i class="fa-solid fa-file-excel me-1"></i>Nhập File Excel
                </button>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle" id="dataTable">
                <thead id="tableHeader">
                    <!-- Dynamic Header render ở đây -->
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic Rows render ở đây -->
                </tbody>
            </table>
        </div>

        <!-- THANH PHÂN TRANG (PAGINATION) -->
        <div class="pagination-container">
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small">Hiển thị:</span>
                <select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;" onchange="changePageSize()">
                    <option value="25">25 dòng/trang</option>
                    <option value="50" selected>50 dòng/trang</option>
                    <option value="100">100 dòng/trang</option>
                    <option value="200">200 dòng/trang</option>
                    <option value="500">500 dòng/trang</option>
                </select>
                <span id="pageInfoSpan" class="text-muted small ms-2">Trang 0 / 0</span>
            </div>

            <nav>
                <ul class="pagination pagination-sm m-0" id="paginationControls">
                    <!-- Control Phân Trang Render Tại Đây -->
                </ul>
            </nav>
        </div>

    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSiSFM2Q6vIkcVQgjfhRMWWWtFPR-aFiHvGXwrFYEqW4x4-EsuRYnL3Mq365Qiic-f/exec";

    // CẤU TRÚC 31 CỘT GỐC & CÁC CỘT KHO TỒN
    const ALL_COLUMNS = [
        { key: 'nganh_hang', label: 'Ngành Hàng' },                           // Cột 1 (A) - Index 0
        { key: 'ncc', label: 'NCC' },                                         // Cột 2 (B) - Index 1
        { key: 'sku', label: 'Mã Sản Phẩm (SKU) NPP, Hãng' },                 // Cột 3 (C) - Index 2
        { key: 'ma_ktb', label: 'Mã KTB' },                                   // Cột 4 (D) - Index 3
        { key: 'brand', label: 'Brand' },                                     // Cột 5 (E) - Index 4
        { key: 'screen', label: 'Màn hình INCH' },                            // Cột 6 (F) - Index 5
        { key: 'chip', label: 'chip' },                                       // Cột 7 (G) - Index 6
        { key: 'ram', label: 'ram' },                                         // Cột 8 (H) - Index 7
        { key: 'ssd', label: 'ssd' },                                         // Cột 9 (I) - Index 8
        { key: 'win', label: 'win' },                                         // Cột 10 (J) - Index 9
        { key: 'office', label: 'office' },                                   // Cột 11 (K) - Index 10
        { key: 'bao_hanh', label: 'Bao_Hanh_Nam' },                           // Cột 12 (L) - Index 11
        { key: 'fp', label: 'FP' },                                           // Cột 13 (M) - Index 12
        { key: 'pin', label: 'PIN adapter' },                                 // Cột 14 (N) - Index 13
        { key: 'led_kb', label: 'led_KB_BK' },                                // Cột 15 (O) - Index 14
        { key: 'alu', label: 'Alu' },                                         // Cột 16 (P) - Index 15
        { key: 'mx_rtx', label: 'MX RTX' },                                   // Cột 17 (Q) - Index 16
        { key: 'sl_nhap_tong', label: 'So_Luong NHAP TONG', numeric: true },  // Cột 18 (R) - Index 17
        { key: 'sl_ton', label: 'So_Luong TON', numeric: true },              // Cột 19 (S) - Index 18
        { key: 'sl_ban_ngay', label: 'số lượng bán ra từ ngày', numeric: true },// Cột 20 (T) - Index 19
        { key: 'pct_ln_tm', label: '% Loi Nhuan Tiền Mặt', numeric: true },   // Cột 21 (U) - Index 20
        { key: 'pct_ln_cn', label: '% Loi Nhuan Công Nợ', numeric: true },    // Cột 22 (V) - Index 21
        { key: 'hang_gui_npp', label: 'Hàng gửi NPP' },                      // Cột 23 (W) - Index 22
        { key: 'cost_ktb', label: 'COST_KTB', numeric: true },               // Cột 24 (X) - Index 23
        { key: 'gia_nhap_cu', label: 'GIÁ NHẬP CỦ', numeric: true },          // Cột 25 (Y) - Index 24
        { key: 'pct_gia_nhap_lech', label: '% GIÁ NHẬP LỆCH TRƯỚC', numeric: true }, // Cột 26 (Z) - Index 25
        { key: 'gia_nhap_moi', label: 'GIÁ NHẬP MỚI (VNĐ)', numeric: true },  // Cột 27 (AA) - Index 26
        { key: 'gia_ban_ktb_tm', label: 'GIÁ BÁN KTB TIỀN MẶT', numeric: true },// Cột 28 (AB) - Index 27
        { key: 'gia_ban_ktb_cn', label: 'GIÁ BÁN KTB CÔNG NỢ', numeric: true },// Cột 29 (AC) - Index 28
        { key: 'ngay_nhap_truoc', label: 'NGÀY NHẬP TRƯỚC', date: true },    // Cột 30 (AD) - Index 29
        { key: 'ngay_nhap_gan_nhat', label: 'NGÀY NHẬP GẦN NHẤT', date: true } // Cột 31 (AE) - Index 30
    ];

    // CẤU TRÚC CHO KHO TỒN MỖI NGÀY (THEO ẢNH MẪU - 10 CỘT TỔNG HỢP)
    const INVENTORY_COLUMNS = [
        { key: 'loai_hang', label: 'Loại hàng hóa', index: 0 },
        { key: 'ma_hang', label: 'Mã hàng hóa', index: 2 },
        { key: 'ten_hang', label: 'Tên hàng hóa', index: 3 },
        { key: 'sl_co_the_dat', label: 'SL có thể đặt', numeric: true, index: 17 },
        { key: 'sl_da_dat_chua_giao', label: 'SL đã đặt chưa giao', numeric: true, index: 19 },
        { key: 'sl_ton_toi_thieu', label: 'Số lượng tồn tối thiểu', numeric: true, index: 11 },
        { key: 'sl_ton', label: 'Số lượng tồn', numeric: true, index: 18 },
        { key: 'don_gia_ban_1', label: 'Đơn giá bán 1', numeric: true, index: 27 },
        { key: 'don_gia_ban_san', label: 'Đơn giá bán sàn', numeric: true, index: 28 },
        { key: 'gia_tri_ton_kho', label: 'Giá trị tồn kho', numeric: true, index: 23 },
        { key: 'dvt', label: 'Đơn vị tính', index: 22 }
    ];

    var currentMode = 'FULL'; 
    var globalRawData = [];  
    var filteredData = []; 
    var currentPage = 1;
    var pageSize = 50;

    document.addEventListener("DOMContentLoaded", function() {
        renderTableHeader();
        loadDataFromSheet();
    });

    function showLoading(show, text) {
        var spinner = document.getElementById('loadingSpinner');
        var spinnerText = document.getElementById('spinnerText');
        if (text) spinnerText.innerText = text;
        spinner.style.display = show ? 'flex' : 'none';
    }

    function switchTableMode(mode) {
        if (currentMode === mode) return;
        currentMode = mode;

        var btnFull = document.getElementById('btnModeFull');
        var btnPrice = document.getElementById('btnModePrice');
        var btnInv = document.getElementById('btnModeInventory');
        var desc = document.getElementById('modeDescription');

        // Reset class nút bấm
        btnFull.className = 'btn btn-outline-warning';
        btnPrice.className = 'btn btn-outline-dark';
        btnInv.className = 'btn btn-outline-info';

        if (mode === 'FULL') {
            btnFull.className = 'btn btn-warning active';
            desc.innerText = 'Đang hiển thị: Danh Sách Máy Tính Xách Tay (Laptop - 31 Cột)';
        } else if (mode === 'PRICE') {
            btnPrice.className = 'btn btn-dark active';
            desc.innerText = 'Đang hiển thị: Danh Sách Máy Tính Để Bàn (PC - 23 Cột)';
        } else if (mode === 'INVENTORY') {
            btnInv.className = 'btn btn-info active text-white';
            desc.innerText = 'Đang hiển thị: Quản Lý Kho Tồn Mỗi Ngày (Báo Cáo Tồn Kho 10 Cột)';
        }

        renderTableHeader();
        applyFilters();
    }

    function getActiveColumns() {
        if (currentMode === 'FULL') {
            return ALL_COLUMNS; 
        } else if (currentMode === 'PRICE') {
            var cols = [
                ALL_COLUMNS[0],  // Ngành hàng
                ALL_COLUMNS[1],  // NCC
                ALL_COLUMNS[2],  // Mã Sản Phẩm (SKU)
                ALL_COLUMNS[3],  // Mã KTB
                ALL_COLUMNS[4],  // Brand
                ALL_COLUMNS[6],  // chip
                ALL_COLUMNS[7],  // ram
                ALL_COLUMNS[8],  // ssd
                ALL_COLUMNS[9],  // win
                ALL_COLUMNS[10], // office
                ALL_COLUMNS[11], // Bao_Hanh_Nam
                ALL_COLUMNS[17], // So_Luong NHAP TONG
                ALL_COLUMNS[18], // So_Luong TON
                ALL_COLUMNS[19], // số lượng bán ra
                ALL_COLUMNS[22], // Hàng gửi NPP
                ALL_COLUMNS[23], // COST_KTB
                ALL_COLUMNS[24], // GIÁ NHẬP CỦ
                ALL_COLUMNS[25], // % GIÁ NHẬP LỆCH
                ALL_COLUMNS[26], // GIÁ NHẬP MỚI
                ALL_COLUMNS[20], // % LN Tiền Mặt
                ALL_COLUMNS[21], // % LN Công Nợ
                ALL_COLUMNS[27], // GIÁ BÁN TIỀN MẶT
                ALL_COLUMNS[28]  // GIÁ BÁN CÔNG NỢ
            ];
            return cols.filter(c => c !== undefined);
        } else if (currentMode === 'INVENTORY') {
            return INVENTORY_COLUMNS;
        }
    }

    function renderTableHeader() {
        var activeCols = getActiveColumns();
        var thead = document.getElementById('tableHeader');
        
        var headerHtml = `<tr><th class="text-center" style="width: 70px;">Thao Tác</th>`;
        var filterRowHtml = `<tr class="bg-light"><td class="text-center"><i class="fa-solid fa-filter text-muted"></i></td>`;

        activeCols.forEach((col, idx) => {
            var colIndex = col.index !== undefined ? col.index : ALL_COLUMNS.findIndex(c => c.key === col.key);
            headerHtml += `<th class="${col.numeric ? 'text-right' : ''}">${col.label}</th>`;
            filterRowHtml += `<td><input type="text" class="filter-input col-filter" data-col-index="${colIndex}" onkeyup="applyFilters()" placeholder="Lọc..."></td>`;
        });

        headerHtml += `</tr>`;
        filterRowHtml += `</tr>`;

        thead.innerHTML = headerHtml + filterRowHtml;
    }

    function formatScreenInch(val) {
        if (!val) return '';
        var str = String(val).trim();
        if (str.includes('T') || (str.includes('-') && str.length > 8)) {
            var matchDay = str.match(/-(\d{2})T/);
            if (matchDay && matchDay[1]) return parseFloat(matchDay[1]);
            var parts = str.split('T')[0].split('-');
            if (parts.length === 3) return parseFloat(parts[2]);
        }
        var cleanNum = str.replace(/[^0-9.]/g, '');
        var num = parseFloat(cleanNum);
        return isNaN(num) ? str : num;
    }

    function formatDateVN(val) {
        if (!val) return '';
        var str = String(val).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes('-')) {
            var parts = str.split('-');
            if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return str;
    }

    function formatNumberVN(val) {
        if (val === '' || val === null || val === undefined) return '0';
        var num = Number(val);
        if (isNaN(num)) return val;
        return num.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
    }

    function loadDataFromSheet() {
        showLoading(true, "Đang đồng bộ dữ liệu với Google Sheets...");
        fetch(GOOGLE_SCRIPT_URL, { method: "GET", redirect: "follow" })
        .then(res => res.json())
        .then(data => {
            showLoading(false);
            if (data.result === "success") {
                globalRawData = data.data || [];
                applyFilters();
            } else {
                alert("Lỗi tải dữ liệu từ Google Sheets: " + data.error);
            }
        })
        .catch(err => {
            showLoading(false);
            console.error("Lỗi API kết nối:", err);
            alert("Không thể kết nối đến Google Apps Script!");
            globalRawData = [];
            applyFilters();
        });
    }

    // TỰ ĐỘNG LỌC THEO CỘT 1 (INDEX 0) HOẶC CHẾ ĐỘ KHO TỒN
    function applyFilters() {
        var globalKeyword = document.getElementById('globalSearchInput').value.toLowerCase().trim();
        var brandKeyword = document.getElementById('brandFilterInput').value.toLowerCase().trim();
        var nccKeyword = document.getElementById('nccFilterInput').value.toLowerCase().trim();
        var codeKeyword = document.getElementById('codeFilterInput').value.toLowerCase().trim();

        var colFilters = {};
        document.querySelectorAll('.col-filter').forEach(input => {
            var colIdx = input.getAttribute('data-col-index');
            var val = input.value.toLowerCase().trim();
            if (val) colFilters[colIdx] = val;
        });

        filteredData = [];

        globalRawData.forEach((row, originalIndex) => {
            var isVisible = true;

            var loaiSP = row[0] ? String(row[0]).toUpperCase().trim() : '';
            if (currentMode === 'FULL') {
                if (loaiSP && loaiSP === 'PC') isVisible = false;
            } else if (currentMode === 'PRICE') {
                if (loaiSP && loaiSP !== 'PC') isVisible = false;
            } else if (currentMode === 'INVENTORY') {
                // Ở chế độ Kho Tồn: Hiển thị tất cả hàng hoá trong kho
                isVisible = true;
            }

            if (globalKeyword && isVisible) {
                var rowText = row.join(' ').toLowerCase();
                if (!rowText.includes(globalKeyword)) isVisible = false;
            }

            if (isVisible && brandKeyword) {
                var brandVal = row[4] ? String(row[4]).toLowerCase() : '';
                var loaiVal = row[0] ? String(row[0]).toLowerCase() : '';
                if (!brandVal.includes(brandKeyword) && !loaiVal.includes(brandKeyword)) isVisible = false;
            }

            if (isVisible && nccKeyword && row[1]) {
                if (!String(row[1]).toLowerCase().includes(nccKeyword)) isVisible = false;
            }

            if (isVisible && codeKeyword) {
                var sku = row[2] ? String(row[2]).toLowerCase() : '';
                var ktb = row[3] ? String(row[3]).toLowerCase() : '';
                if (!sku.includes(codeKeyword) && !ktb.includes(codeKeyword)) isVisible = false;
            }

            if (isVisible) {
                for (var idx in colFilters) {
                    var cellVal = row[idx] !== undefined ? String(row[idx]).toLowerCase() : '';
                    if (!cellVal.includes(colFilters[idx])) {
                        isVisible = false;
                        break;
                    }
                }
            }

            if (isVisible) {
                filteredData.push({ rowData: row, originalIndex: originalIndex });
            }
        });

        currentPage = 1;
        renderTablePage();
    }

    function resetFilters() {
        document.getElementById('globalSearchInput').value = '';
        document.getElementById('brandFilterInput').value = '';
        document.getElementById('nccFilterInput').value = '';
        document.getElementById('codeFilterInput').value = '';
        document.querySelectorAll('.col-filter').forEach(i => i.value = '');
        applyFilters();
    }

    function renderTablePage() {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        var totalItems = filteredData.length;
        var activeCols = getActiveColumns();

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="${activeCols.length + 1}" class="text-center text-muted py-4">Chưa có dữ liệu. Vui lòng nhấn <strong>'Thêm Sản Phẩm'</strong> hoặc <strong>'Nhập File Excel'</strong> để tải dữ liệu lên.</td></tr>`;
            document.getElementById('rowCountBadge').innerText = `Hiển thị: 0 / 0 dòng`;
            document.getElementById('pageInfoSpan').innerText = `Trang 0 / 0`;
            renderPaginationControls(0);
            return;
        }

        var totalPages = Math.ceil(totalItems / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        var startIndex = (currentPage - 1) * pageSize;
        var endIndex = Math.min(startIndex + pageSize, totalItems);

        for (var i = startIndex; i < endIndex; i++) {
            var item = filteredData[i];
            appendRowToTable(item.rowData, item.originalIndex, activeCols);
        }

        document.getElementById('rowCountBadge').innerText = `Hiển thị: ${totalItems} / ${globalRawData.length} dòng`;
        document.getElementById('pageInfoSpan').innerText = `Trang ${currentPage} / ${totalPages} (Từ ${startIndex + 1} - ${endIndex})`;

        renderPaginationControls(totalPages);
    }

    function appendRowToTable(rowData, originalIndex, activeCols) {
        var tbody = document.getElementById('tableBody');
        var tr = document.createElement('tr');
        
        var sheetRowIndex = originalIndex + 2;
        tr.setAttribute('data-sheet-row', sheetRowIndex);

        var actionTd = `<td class="text-center">
            <button class="btn btn-sm btn-outline-warning btn-edit py-0 px-2" onclick="editRow(this)"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="btn btn-sm btn-success btn-save py-0 px-2" onclick="saveRow(this)" style="display:none;"><i class="fa-solid fa-floppy-disk"></i></button>
        </td>`;

        var cellsHtml = actionTd;

        activeCols.forEach(col => {
            var colIdx = col.index !== undefined ? col.index : ALL_COLUMNS.findIndex(c => c.key === col.key);
            var val = (rowData && rowData[colIdx] !== undefined) ? rowData[colIdx] : '';
            var displayVal = val;
            var alignClass = col.numeric ? "text-right" : "";

            if (col.key === 'screen') {
                displayVal = formatScreenInch(val);
                alignClass = "text-center";
            } else if (col.date) {
                displayVal = formatDateVN(val);
            } else if (col.numeric) {
                displayVal = formatNumberVN(val);
            } else if (col.key === 'dvt' && !val) {
                displayVal = 'Cái'; // Mặc định đơn vị tính
            }

            cellsHtml += `<td class="${alignClass}" data-col-idx="${colIdx}" data-raw-val="${val}">${displayVal}</td>`;
        });

        tr.innerHTML = cellsHtml;
        tbody.appendChild(tr);
    }

    function renderPaginationControls(totalPages) {
        var container = document.getElementById('paginationControls');
        container.innerHTML = '';
        if (totalPages <= 1) return;

        container.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(1); return false;"><i class="fa-solid fa-angles-left"></i></a>
        </li>`;
        container.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;"><i class="fa-solid fa-angle-left"></i></a>
        </li>`;

        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

        for (var p = startPage; p <= endPage; p++) {
            container.innerHTML += `<li class="page-item ${p === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="goToPage(${p}); return false;">${p}</a>
            </li>`;
        }

        container.innerHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;"><i class="fa-solid fa-angle-right"></i></a>
        </li>`;
        container.innerHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${totalPages}); return false;"><i class="fa-solid fa-angles-right"></i></a>
        </li>`;
    }

    function goToPage(page) {
        currentPage = page;
        renderTablePage();
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        currentPage = 1;
        renderTablePage();
    }

    function editRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');

        for (var i = 1; i < cells.length; i++) {
            var colIdx = parseInt(cells[i].getAttribute('data-col-idx'));
            var colConfig = ALL_COLUMNS[colIdx];
            var rawVal = cells[i].getAttribute('data-raw-val') || cells[i].innerText.trim();

            if (colConfig && colConfig.date) {
                cells[i].innerHTML = `<input type="date" class="editable-input" value="${rawVal}">`;
            } else {
                cells[i].innerHTML = `<input type="text" class="editable-input" value="${rawVal}">`;
            }
        }

        tr.querySelector('.btn-edit').style.display = 'none';
        tr.querySelector('.btn-save').style.display = 'inline-block';
    }

    function saveRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var sheetRowIndex = parseInt(tr.getAttribute('data-sheet-row'));

        var fullRowData = globalRawData[sheetRowIndex - 2] ? [...globalRawData[sheetRowIndex - 2]] : new Array(ALL_COLUMNS.length).fill('');

        for (var i = 1; i < cells.length; i++) {
            var colIdx = parseInt(cells[i].getAttribute('data-col-idx'));
            var input = cells[i].querySelector('input');
            var val = input ? input.value.trim() : cells[i].innerText.trim();
            fullRowData[colIdx] = val;
        }

        showLoading(true, "Đang lưu thay đổi...");

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "updateRow",
                rowIndex: sheetRowIndex,
                rowData: fullRowData
            }),
            redirect: "follow"
        })
        .then(res => res.json())
        .then(data => {
            showLoading(false);
            if (data.result === "success") {
                alert("Lưu dữ liệu thành công!");
                loadDataFromSheet();
            } else {
                alert("Lỗi từ máy chủ: " + data.error);
            }
        })
        .catch(err => {
            showLoading(false);
            alert("Đã gửi yêu cầu lưu! Đang đồng bộ lại...");
            setTimeout(loadDataFromSheet, 1500);
        });
    }

    function addRow() {
        var emptyRow = new Array(ALL_COLUMNS.length).fill('');
        emptyRow[0] = currentMode === 'FULL' ? 'LAPTOP' : (currentMode === 'PRICE' ? 'PC' : 'Linh Kiện');
        
        globalRawData.push(emptyRow);
        applyFilters();
        var totalPages = Math.ceil(filteredData.length / pageSize) || 1;
        goToPage(totalPages);
        
        var tbody = document.getElementById('tableBody');
        var lastRow = tbody.lastElementChild;
        if (lastRow) editRow(lastRow.querySelector('.btn-edit'));
    }

    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = async function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });
            var worksheet = workbook.Sheets[workbook.SheetNames[0]];
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            var rawRows = excelData.slice(1).filter(r => r.length > 0 && r.some(cell => cell !== null && cell !== ''));

            if (rawRows.length === 0) {
                alert("File Excel không có dữ liệu hợp lệ!");
                return;
            }

            var formattedRows = rawRows.map(row => {
                var newRow = [];
                for (var i = 0; i < ALL_COLUMNS.length; i++) {
                    var cellVal = row[i] !== undefined && row[i] !== null ? row[i] : '';
                    newRow.push(String(cellVal));
                }
                return newRow;
            });

            var BATCH_SIZE = 500;
            var totalRows = formattedRows.length;
            var successCount = 0;

            showLoading(true, `Đang chuẩn bị tải lên ${totalRows} dòng...`);

            for (var i = 0; i < totalRows; i += BATCH_SIZE) {
                var chunk = formattedRows.slice(i, i + BATCH_SIZE);
                var currentEnd = Math.min(i + BATCH_SIZE, totalRows);
                
                showLoading(true, `Đang tải lên Google Sheets: ${currentEnd} / ${totalRows} dòng...`);

                try {
                    var response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "appendRows", rows: chunk }),
                        redirect: "follow"
                    });
                    var resData = await response.json();
                    if (resData.result === "success") {
                        successCount += chunk.length;
                    } else {
                        console.error("Lỗi đợt tải:", resData.error);
                    }
                } catch (err) {
                    console.error("Lỗi kết nối đợt:", err);
                }
            }

            showLoading(false);
            alert(`Đã hoàn tất tải lên ${successCount} / ${totalRows} dòng vào Google Sheets thành công!`);
            loadDataFromSheet();
            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
