<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dữ Liệu Google Sheet</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Thư viện SheetJS đọc file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .table-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .editable-input { width: 100%; border: 1px solid #ced4da; border-radius: 4px; padding: 4px 8px; }
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: none; justify-content: center;
            align-items: center; z-index: 9999; color: #fff; flex-direction: column;
        }
    </style>
</head>
<body>

<div class="container-fluid table-container">
    <h3 class="mb-4">Quản Lý Dữ Liệu</h3>

    <!-- Thanh công cụ -->
    <div class="row mb-3 g-2 align-items-center">
        <div class="col-auto">
            <select id="modeSelect" class="form-select" onchange="changeMode(this.value)">
                <option value="BAN_HANG">Bán Hàng</option>
                <option value="NHAP_HANG">Nhập Hàng</option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" onclick="addRow()">+ Thêm dòng mới</button>
        </div>
        <div class="col-auto">
            <label class="btn btn-success mb-0">
                Tải Excel lên <input type="file" id="excelFileInput" accept=".xlsx, .xls" hidden onchange="handleExcelUpload(event)">
            </label>
        </div>
        <div class="col-auto ms-auto d-flex align-items-center gap-2">
            <label>Hiển thị:</label>
            <select id="pageSizeSelect" class="form-select w-auto" onchange="changePageSize()">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
        </div>
    </div>

    <!-- Bảng dữ liệu -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle" id="dataTable">
            <thead class="table-light" id="tableHeader">
                <!-- Header sinh tự động qua JS -->
            </thead>
            <tbody id="tableBody">
                <!-- Dữ liệu sinh tự động qua JS -->
            </tbody>
        </table>
    </div>

    <!-- Phân trang -->
    <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="pageInfo">Trang 1 / 1</span>
        <nav>
            <ul class="pagination pagination-sm mb-0" id="pagination">
                <!-- Các nút phân trang -->
            </ul>
        </nav>
    </div>
</div>

<!-- Màn hình Loading -->
<div id="loadingOverlay">
    <div class="spinner-border text-light mb-2" role="status"></div>
    <div id="loadingText">Đang xử lý...</div>
</div>

<script>
    // ==========================================
    // 1. BIẾN TOÀN CỤC & CẤU HÌNH
    // ==========================================
    let currentPage = 1;
    let pageSize = 10;
    let currentMode = 'BAN_HANG';
    
    // Thay URL Web App Google Apps Script của bạn vào đây
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

    // Cấu hình cột theo từng Sheet/Mode
    const COLUMN_CONFIGS = {
        'BAN_HANG': [
            { name: 'STT', date: false },
            { name: 'Mã Đơn', date: false },
            { name: 'Ngày Ghi Sổ', date: true },
            { name: 'Tên Khách Hàng', date: false },
            { name: 'SĐT', date: false },
            { name: 'Địa Chỉ', date: false },
            { name: 'Mã Sản Phẩm', date: false },
            { name: 'Tên Sản Phẩm', date: false },
            { name: 'Loại Hàng', date: false },
            { name: 'Thương Hiệu', date: false },
            { name: 'Cấu Hình', date: false },
            { name: 'Số Lượng', date: false },
            { name: 'Đơn Giá', date: false },
            { name: 'Thành Tiền', date: false },
            { name: 'Đơn Vị Tính', date: false },
            { name: 'Thuế VAT', date: false },
            { name: 'Ghi Chú', date: false }
        ],
        'NHAP_HANG': [
            { name: 'STT', date: false },
            { name: 'Mã Nhập', date: false },
            { name: 'Ngày Nhập', date: true },
            { name: 'Nhà Cung Cấp', date: false },
            { name: 'Tên Sản Phẩm', date: false },
            { name: 'Số Lượng', date: false },
            { name: 'Đơn Giá Nhập', date: false },
            { name: 'Tổng Tiền', date: false },
            { name: 'Ghi Chú', date: false }
        ]
    };

    // Mảng lưu dữ liệu hiện tại tải từ Sheet
    let rawSheetData = [];

    // ==========================================
    // 2. HÀM BỔ TRỢ & KHỞI TẠO
    // ==========================================
    window.onload = function() {
        renderTableHeader();
        loadDataFromSheet();
    };

    function getActiveColumns() {
        return COLUMN_CONFIGS[currentMode] || [];
    }

    function changeMode(mode) {
        currentMode = mode;
        currentPage = 1;
        renderTableHeader();
        loadDataFromSheet();
    }

    function showLoading(show, message = 'Đang xử lý...') {
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = message;
        overlay.style.display = show ? 'flex' : 'none';
    }

    function renderTableHeader() {
        const activeCols = getActiveColumns();
        const headerEl = document.getElementById('tableHeader');
        let html = '<tr><th style="width: 100px;">Thao tác</th>';
        activeCols.forEach(col => {
            html += `<th>${col.name}</th>`;
        });
        html += '</tr>';
        headerEl.innerHTML = html;
    }

    function loadDataFromSheet() {
        showLoading(true, `Đang tải dữ liệu Sheet '${currentMode}'...`);
        
        fetch(`${GOOGLE_SCRIPT_URL}?action=getData&sheetName=${currentMode}`)
            .then(res => res.json())
            .then(data => {
                showLoading(false);
                if (data.status === 'success') {
                    rawSheetData = data.rows || [];
                    renderTablePage();
                } else {
                    alert("Lỗi tải dữ liệu: " + data.message);
                }
            })
            .catch(err => {
                showLoading(false);
                console.warn("Không thể kết nối API Google Script. Đang hiển thị bảng trống.");
                rawSheetData = [];
                renderTablePage();
            });
    }

    function renderTablePage() {
        const bodyEl = document.getElementById('tableBody');
        const activeCols = getActiveColumns();
        bodyEl.innerHTML = '';

        const startIdx = (currentPage - 1) * pageSize;
        const endIdx = Math.min(startIdx + pageSize, rawSheetData.length);
        const pageData = rawSheetData.slice(startIdx, endIdx);

        pageData.forEach((row, index) => {
            const actualRowIdx = startIdx + index + 2; // +2 vì bỏ qua header Sheet (dòng 1)
            let tr = document.createElement('tr');
            tr.setAttribute('data-sheet-row', actualRowIdx);

            let actionTd = `
                <td>
                    <button class="btn btn-sm btn-warning btn-edit" onclick="editRow(this)">Sửa</button>
                    <button class="btn btn-sm btn-success btn-save" style="display:none;" onclick="saveRow(this)">Lưu</button>
                </td>`;
            
            let cellsTd = '';
            for (let i = 0; i < activeCols.length; i++) {
                let cellVal = row[i] !== undefined ? row[i] : '';
                cellsTd += `<td data-raw-val="${cellVal}">${cellVal}</td>`;
            }

            tr.innerHTML = actionTd + cellsTd;
            bodyEl.appendChild(tr);
        });

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.max(1, Math.ceil(rawSheetData.length / pageSize));
        document.getElementById('pageInfo').innerText = `Trang ${currentPage} / ${totalPages} (Tổng ${rawSheetData.length} dòng)`;

        const pagEl = document.getElementById('pagination');
        let html = '';

        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">Trước</a>
                 </li>`;

        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>
                         </li>`;
            }
        }

        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">Sau</a>
                 </li>`;

        pagEl.innerHTML = html;
    }

    // ==========================================
    // 3. ĐOẠN CODE THAO TÁC CỦA BẠN
    // ==========================================
    function goToPage(page) {
        const totalPages = Math.ceil(rawSheetData.length / pageSize) || 1;
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderTablePage();
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        currentPage = 1;
        renderTablePage();
    }

    function editRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var activeCols = getActiveColumns();

        for (var i = 1; i < cells.length; i++) {
            var colIdx = i - 1;
            var colConfig = activeCols[colIdx];
            var rawVal = cells[i].getAttribute('data-raw-val') || cells[i].innerText.trim();

            if (colConfig && colConfig.date) {
                cells[i].innerHTML = `<input type="date" class="editable-input" value="${rawVal}">`;
            } else {
                cells[i].innerHTML = `<input type="text" class="editable-input" value="${rawVal}">`;
            }
        }

        tr.querySelector('.btn-edit').style.display = 'none';
        tr.querySelector('.btn-save').style.display = 'inline-block';
    }

    function saveRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var sheetRowIndex = parseInt(tr.getAttribute('data-sheet-row'));

        var fullRowData = [];
        for (var i = 1; i < cells.length; i++) {
            var input = cells[i].querySelector('input');
            var val = input ? input.value.trim() : cells[i].innerText.trim();
            fullRowData.push(val);
        }

        showLoading(true, `Đang ghi dữ liệu vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "updateRow",
            sheetName: currentMode,
            rowIndex: sheetRowIndex,
            rowData: fullRowData
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                alert("Đã lưu dữ liệu thành công!");
                loadDataFromSheet();
            }, 1200);
        })
        .catch(err => {
            showLoading(false);
            alert("Lỗi lưu dữ liệu!");
        });
    }

    function addRow() {
        var activeCols = getActiveColumns();
        var emptyRow = new Array(activeCols.length).fill('');
        if (currentMode === 'BAN_HANG') {
            var now = new Date().toISOString().split('T')[0];
            emptyRow[2] = now; // Mặc định điền Ngày ghi sổ là ngày hôm nay
            emptyRow[14] = 'Cái';
            emptyRow[15] = 'Không';
        }

        showLoading(true, `Đang thêm dòng mới vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "appendRows",
            sheetName: currentMode,
            rows: [emptyRow]
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                loadDataFromSheet();
            }, 1200);
        });
    }

    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var activeCols = getActiveColumns();

        var reader = new FileReader();
        reader.onload = async function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });
            var worksheet = workbook.Sheets[workbook.SheetNames[0]];
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            var rawRows = excelData.slice(1).filter(r => r.length > 0 && r.some(cell => cell !== null && cell !== ''));

            if (rawRows.length === 0) {
                alert("File Excel không chứa dữ liệu!");
                return;
            }

            var formattedRows = rawRows.map(row => {
                var newRow = [];
                for (var i = 0; i < activeCols.length; i++) {
                    var cellVal = row[i] !== undefined && row[i] !== null ? row[i] : '';
                    newRow.push(String(cellVal));
                }
                return newRow;
            });

            var BATCH_SIZE = 100;
            var totalRows = formattedRows.length;

            showLoading(true, `Đang đẩy ${totalRows} dòng vào Sheet '${currentMode}'...`);

            for (var i = 0; i < totalRows; i += BATCH_SIZE) {
                var chunk = formattedRows.slice(i, i + BATCH_SIZE);
                var formData = new URLSearchParams();
                formData.append("payload", JSON.stringify({
                    action: "appendRows",
                    sheetName: currentMode,
                    rows: chunk
                }));

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData.toString()
                    });
                } catch (err) {}
            }

            setTimeout(() => {
                showLoading(false);
                alert(`Đã hoàn tất tải lên file Excel vào Sheet '${currentMode}'!`);
                loadDataFromSheet();
            }, 1500);

            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
