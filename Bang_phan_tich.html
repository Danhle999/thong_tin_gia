<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Dữ Liệu Bán Hàng & Nhập Kho</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS đọc file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 1. Khung bao ngoài bảng */
        .table-responsive {
            overflow-x: auto !important;
            overflow-y: auto !important;
            max-height: calc(100vh - 220px) !important;
            width: 100% !important;
            border: 1px solid #dee2e6;
        }

        /* 2. Cấu hình bảng co dãn linh hoạt */
        #dataTable {
            table-layout: fixed !important;
            width: max-content !important;
            border-collapse: separate;
            border-spacing: 0;
        }

        /* 3. Tiêu đề và ô dữ liệu cho phép thu nhỏ tối đa */
        #dataTable th, 
        #dataTable td {
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            box-sizing: border-box !important;
            padding: 8px 6px !important;
        }

        /* 4. Ép thẻ th cho phép co lại nhỏ hơn văn bản tiêu đề */
        #dataTable th {
            position: relative !important;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f1f5f9;
            min-width: 0 !important;
        }

        /* 5. Vạch kéo Resizer ở cạnh phải mỗi cột */
        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 100%;
            cursor: col-resize !important;
            user-select: none;
            z-index: 10;
        }

        .resizer:hover,
        .resizer.resizing {
            border-right: 3px solid #0d6efd !important;
            background-color: rgba(13, 110, 253, 0.1);
        }

        /* 6. Ô nhập liệu khi Edit */
        #dataTable td input.editable-input {
            width: 100% !important;
            box-sizing: border-box !important;
            border: 1px solid #0d6efd;
            padding: 2px 4px;
            font-size: 0.85rem;
            border-radius: 4px;
        }

        .text-right { text-align: right; }
        .text-center { text-align: center; }

        /* Sticky Footer Tính Tổng */
        tfoot th, tfoot td {
            position: sticky;
            bottom: 0;
            background-color: #e9ecef !important;
            color: #0d6efd;
            font-weight: bold;
            z-index: 9;
            border-top: 2px solid #0d6efd !important;
            border-bottom: 1px solid #dee2e6;
        }

        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; }
        .filter-card { background: #eef2f7; border-radius: 6px; padding: 15px; margin-bottom: 15px; }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }

        .view-mode-btn-group .btn { font-weight: 600; }
        .view-mode-btn-group .btn.active { box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<!-- Loading Spinner -->
<div id="loadingSpinner">
    <div class="text-center">
        <div class="spinner-border text-primary" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
        <div class="mt-2 fw-bold text-dark" id="spinnerText">Đang nạp dữ liệu từ Google Sheets...</div>
    </div>
</div>

<div class="container-fluid my-3">
    <div class="table-container">
        <!-- HEADER TRANG & NÚT CHUYỂN TAB CẢ 6 SHEET -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div>
                <h4 class="text-primary fw-bold m-0"><i class="fa-solid fa-boxes-packing me-2"></i>Hệ Thống Quản Lý Dữ Liệu</h4>
                <small class="text-muted" id="modeDescription">Đang hiển thị Trang tính: BAN_HANG (17 Cột)</small>
            </div>
            
            <div class="btn-group view-mode-btn-group" role="group">
                <button type="button" id="btnModeBanHang" class="btn btn-success active" onclick="switchTableMode('BAN_HANG')">
                    <i class="fa-solid fa-cart-shopping me-1"></i> BÁN HÀNG
                </button>
                <button type="button" id="btnModeNhapKho" class="btn btn-outline-primary" onclick="switchTableMode('NHAP_KHO')">
                    <i class="fa-solid fa-file-import me-1"></i> NHẬP KHO
                </button>
                <button type="button" id="btnModeLaptop" class="btn btn-outline-warning" onclick="switchTableMode('LAPTOP')">
                    <i class="fa-solid fa-laptop me-1"></i> LAPTOP
                </button>
                <button type="button" id="btnModePc" class="btn btn-outline-dark" onclick="switchTableMode('PC')">
                    <i class="fa-solid fa-desktop me-1"></i> PC
                </button>
                <button type="button" id="btnModeLcd" class="btn btn-outline-danger" onclick="switchTableMode('LCD')">
                    <i class="fa-solid fa-tv me-1"></i> LCD
                </button>
                <button type="button" id="btnModeTonKho" class="btn btn-outline-info" onclick="switchTableMode('TON_KHO')">
                    <i class="fa-solid fa-warehouse me-1"></i> TỒN KHO
                </button>
            </div>

            <span class="badge bg-info text-dark fs-6" id="rowCountBadge">Hiển thị: 0 / 0 dòng</span>
        </div>

        <!-- BỘ LỌC TÌM KIẾM NÂNG CAO -->
        <div class="filter-card">
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-magnifying-glass me-1"></i>Tìm kiếm nhanh:</label>
                    <input type="text" id="globalSearchInput" class="form-control form-control-sm" placeholder="Nhập từ khóa bất kỳ..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-calendar me-1"></i>Từ ngày:</label>
                    <input type="date" id="fromDateInput" class="form-control form-control-sm" onchange="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-calendar me-1"></i>Đến ngày:</label>
                    <input type="date" id="toDateInput" class="form-control form-control-sm" onchange="applyFilters()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-user me-1"></i>Khách hàng / NCC / Mã:</label>
                    <input type="text" id="customerFilterInput" class="form-control form-control-sm" placeholder="Tìm tên KH, NCC hoặc Mã..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-sm btn-secondary w-100 mt-3" onclick="resetFilters()"><i class="fa-solid fa-rotate-left me-1"></i>Xóa bộ lọc</button>
                </div>
            </div>
        </div>
        
        <!-- NÚT THAO TÁC -->
        <div class="row mb-3">
            <div class="col-md-6 d-flex gap-2">
                <button class="btn btn-sm btn-success" onclick="addRow()"><i class="fa-solid fa-plus me-1"></i>Thêm Dòng Mới</button>
                <button class="btn btn-sm btn-primary" onclick="loadDataFromSheet()"><i class="fa-solid fa-rotate me-1"></i>Tải Lại Sheet Này</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end gap-2">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
                <button class="btn btn-sm btn-outline-success" onclick="document.getElementById('excelFileInput').click()">
                    <i class="fa-solid fa-file-excel me-1"></i>Nhập Từ Excel Vào Sheet Này
                </button>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle" id="dataTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFooter"></tfoot>
            </table>
        </div>

        <!-- PHÂN TRANG -->
        <div class="pagination-container">
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small">Hiển thị:</span>
                <select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;" onchange="changePageSize()">
                    <option value="25">25 dòng/trang</option>
                    <option value="50" selected>50 dòng/trang</option>
                    <option value="100">100 dòng/trang</option>
                    <option value="200">200 dòng/trang</option>
                    <option value="500">500 dòng/trang</option>
                </select>
                <span id="pageInfoSpan" class="text-muted small ms-2">Trang 0 / 0</span>
            </div>

            <nav>
                <ul class="pagination pagination-sm m-0" id="paginationControls"></ul>
            </nav>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxy-k8aQWyknyTnDVLm9CrKO9C85viGIAJ3VhhFt_Gk35kIXBIN-kUeXycd8Bs-VM/exec";
    
    // Bảng cấu hình chi tiết cho cả 6 Sheet
    const SHEET_CONFIGS = {
        'BAN_HANG': [
            { label: 'Tên khách hàng', customer: true }, { label: 'Số đơn hàng' }, { label: 'Ngày ghi sổ', date: true },
            { label: 'Số đề nghị trả lại' }, { label: 'Ngày đề nghị trả lại', date: true }, { label: 'Mã hàng hóa', code: true },
            { label: 'Diễn giải', code: true }, { label: 'Số lượng bán', numeric: true }, { label: 'Thành tiền bán', numeric: true },
            { label: 'Tổng tiền bán', numeric: true }, { label: 'Số lượng trả lại', numeric: true }, { label: 'Thành tiền trả lại', numeric: true },
            { label: 'Tổng tiền trả lại', numeric: true }, { label: 'Người thực hiện' }, { label: 'Đơn vị' },
            { label: 'Là combo hàng hóa' }, { label: 'ĐƠN GIÁ', numeric: true }
        ],
        'NHAP_KHO': [
            { label: 'Ngày HT', date: true }, { label: 'Ngày CT', date: true }, { label: 'Số CT' }, { label: 'Ngày Hạn TT', date: true },
            { label: 'Mã NCC', ncc: true }, { label: 'Tên NCC', ncc: true }, { label: 'Diễn Giải', code: true }, { label: 'Mã Hàng', code: true },
            { label: 'ĐVT' }, { label: 'Số Lượng', numeric: true }, { label: 'Đơn Giá', numeric: true }, { label: 'Thành Tiền', numeric: true },
            { label: 'Giá cost', numeric: true }, { label: 'Chiết khấu', numeric: true }, { label: 'Sell out', numeric: true },
            { label: 'Sell in', numeric: true }, { label: 'Tên nhóm VTHH', desc: true }
        ],
        'LAPTOP': [
            { label: 'NGÀNH HÀNG' }, { label: 'NCC' }, { label: 'Mã SKU NPP, Hãng' }, { label: 'Mã KTB' },
            { label: 'Brand' }, { label: 'Màn hình INCH' }, { label: 'Chip' }, { label: 'RAM' },
            { label: 'SSD' }, { label: 'Win' }, { label: 'Office' }, { label: 'Bảo Hành (Năm)' },
            { label: 'FP' }, { label: 'PIN Adapter' }, { label: 'LED KB BK' }, { label: 'Alu' },
            { label: 'MX RTX' }, { label: 'Số Lượng Nhập Tổng', numeric: true }, { label: 'Số Lượng Tồn', numeric: true },
            { label: 'Số Lượng Bán Ra', numeric: true }, 
            { label: '% Lợi Nhuận Tiền Mặt', numeric: true, percent: true }, 
            { label: '% Lợi Nhuận Công Nợ', numeric: true, percent: true },
            { label: 'Hàng gửi NPP' }, { label: 'COST_KTB', numeric: true }, { label: 'GIÁ NHẬP CŨ', numeric: true },
            { label: '% GIÁ NHẬP LỆCH', numeric: true, percent: true }, 
            { label: 'GIÁ NHẬP MỚI (VNĐ)', numeric: true },
            { label: 'GIÁ BÁN TIỀN MẶT', numeric: true }, { label: 'GIÁ BÁN CÔNG NỢ', numeric: true }, { label: 'NGÀY NHẬP CŨ', date: true },
            { label: 'NGÀY NHẬP MỚI', date: true }
        ],
        'PC': [
            { label: 'NCC' }, { label: 'Mã SKU NPP, Hãng' }, { label: 'Mã KTB' }, { label: 'Brand' },
            { label: 'Chip' }, { label: 'RAM' }, { label: 'SSD' }, { label: 'Win' },
            { label: 'Bảo Hành (Năm)' }, { label: 'Office' },
            { label: 'Số Lượng Nhập Tổng', numeric: true }, { label: 'Số Lượng Tồn', numeric: true },
            { label: 'Số Lượng Bán Từ Ngày', numeric: true }, { label: 'Hàng gửi NPP' },
            { label: 'COST_KTB', numeric: true }, { label: 'GIÁ NHẬP TRƯỚC', numeric: true },
            { label: '% GIÁ LỆCH TRƯỚC', numeric: true, percent: true }, { label: 'GIÁ NHẬP (VNĐ)', numeric: true },
            { label: '% Lợi Nhuận Tiền Mặt', numeric: true, percent: true }, { label: '% Lợi Nhuận Công Nợ', numeric: true, percent: true },
            { label: 'GIÁ BÁN KTB TIỀN MẶT', numeric: true }, { label: 'GIÁ BÁN KTB CÔNG NỢ', numeric: true },
            { label: 'NGÀY NHẬP TRƯỚC', date: true }, { label: 'NGÀY NHẬP GẦN NHẤT', date: true }
        ],
        'LCD': [
            { label: 'NCC' }, { label: 'Mã NPP' }, { label: 'Mã Sản Phẩm KTB' }, { label: 'Brand' },
            { label: 'Kích Thước (inch)' }, { label: 'Độ Trễ' }, { label: 'Tấm Nền' }, { label: 'Tần Số Quét' },
            { label: 'Độ Phân Giải' }, { label: 'Cổng Xuất Hình 1' }, { label: 'Cổng Xuất Hình 2' },
            { label: 'Cổng Xuất Hình 3' }, { label: 'Cổng Khác' }, { label: 'LOA' },
            { label: 'GIÁ COST', numeric: true }, { label: 'GIÁ NHẬP (VNĐ)', numeric: true },
            { label: 'GIÁ BÁN KTB', numeric: true }, { label: 'GIÁ ĐỀ XUẤT', numeric: true },
            { label: 'NGÀY NHẬP GẦN NHẤT', date: true }, { label: 'So_Luong NHAP TONG', numeric: true },
            { label: 'KHO KTB', numeric: true }, { label: 'số lượng bán ra từ ngày', numeric: true },
            { label: '% Loi_Nhuan GIÁ NHẬP', numeric: true, percent: true }, { label: '% Loi_Nhuan GIÁ COST', numeric: true, percent: true }
        ],
        'TON_KHO': [
            { label: 'Mã Hàng', code: true }, { label: 'Tên Hàng Hóa', desc: true }, { label: 'ĐVT' },
            { label: 'Tồn Đầu Kỳ', numeric: true }, { label: 'Nhập Trong Kỳ', numeric: true },
            { label: 'Xuất Trong Kỳ', numeric: true }, { label: 'Tồn Cuối Kỳ', numeric: true },
            { label: 'Tổng Giá Trị Tồn', numeric: true }
        ]
    };

    // KHAI BÁO BIẾN TOÀN CỤC
    let currentMode = 'BAN_HANG';
    let rawData = []; // Mảng chứa object { sheetRowIndex, values }
    let filteredData = [];
    let currentPage = 1;
    let pageSize = 50;

    // LẤY CẤU HÌNH CỘT CHO SHEET HIỆN TẠI
    function getActiveColumns() { return SHEET_CONFIGS[currentMode] || []; }

    // CHUYỂN ĐỔI TAB SHEET
    function switchTableMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.view-mode-btn-group .btn').forEach(btn => btn.classList.remove('active'));
        
        let btnId = mode === 'BAN_HANG' ? 'btnModeBanHang' : 
                    mode === 'NHAP_KHO' ? 'btnModeNhapKho' : 
                    mode === 'LAPTOP' ? 'btnModeLaptop' : 
                    mode === 'PC' ? 'btnModePc' : 
                    mode === 'LCD' ? 'btnModeLcd' : 'btnModeTonKho';
        document.getElementById(btnId).classList.add('active');
        
        let cols = getActiveColumns();
        document.getElementById('modeDescription').innerText = `Đang hiển thị Trang tính: ${mode} (${cols.length} Cột)`;
        
        resetFilters(false);
        loadDataFromSheet();
    }

    // HIỂN THỊ / ẨN SPINNER LOADING
    function showLoading(show, text = "Đang nạp dữ liệu từ Google Sheets...") {
        document.getElementById('loadingSpinner').style.display = show ? 'flex' : 'none';
        document.getElementById('spinnerText').innerText = text;
    }

    // TẢI DỮ LIỆU TỪ GOOGLE APPS SCRIPT VỀ (ĐÃ SỬA: LƯU VỊ TRÍ DÒNG THỰC TẾ)
    function loadDataFromSheet() {
        showLoading(true, `Đang tải dữ liệu Sheet ${currentMode}...`);
        fetch(`${GOOGLE_SCRIPT_URL}?action=getData&sheetName=${currentMode}`)
            .then(res => res.json())
            .then(data => {
                // Tiêu đề nằm ở dòng 1, dữ liệu bắt đầu từ dòng 2 (index + 2)
                rawData = data.slice(1).map((row, index) => {
                    return {
                        sheetRowIndex: index + 2,
                        values: row
                    };
                });
                filteredData = [...rawData];
                currentPage = 1;
                renderTableHeader();
                renderTablePage();
                showLoading(false);
            })
            .catch(err => {
                showLoading(false);
                alert("Lỗi tải dữ liệu. Vui lòng kiểm tra lại URL Apps Script hoặc kết nối mạng!");
            });
    }

    // VẼ TIÊU ĐỀ BẢNG (HEADER) VÀ ĐÍNH KÈM RESIZER
    function renderTableHeader() {
        let cols = getActiveColumns();
        let thead = document.getElementById('tableHeader');
        let html = '<tr><th style="width: 80px;" class="text-center">Thao tác</th>';
        
        cols.forEach((col) => {
            let defaultWidth = col.desc ? '280px' : (col.customer || col.ncc) ? '200px' : '140px';
            html += `<th style="width: ${defaultWidth};">${col.label} <div class="resizer"></div></th>`;
        });
        html += '</tr>';
        thead.innerHTML = html;
        initResizer();
    }

    // ĐỊNH DẠNG SỐ TIỀN VNĐ
    function formatNumberVN(val) {
        if (val === null || val === undefined || val === '' || isNaN(val)) return val;
        return Number(val).toLocaleString('vi-VN');
    }

    // ĐỊNH DẠNG PHẦN TRĂM (%)
    function formatPercent(val) {
        if (val === null || val === undefined || val === '') return '';
        let cleanVal = String(val).replace('%', '').trim();
        let num = parseFloat(cleanVal);
        if (isNaN(num)) return val;
        if (Math.abs(num) > 1) {
            num = num / 100;
        }
        return new Intl.NumberFormat('vi-VN', {
            style: 'percent',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num);
    }

    // XỬ LÝ BỘ LỌC
    function applyFilters() {
        let kw = document.getElementById('globalSearchInput').value.toLowerCase();
        let kwCustomer = document.getElementById('customerFilterInput').value.toLowerCase();
        let fromDateStr = document.getElementById('fromDateInput').value;
        let toDateStr = document.getElementById('toDateInput').value;
        
        let fromDate = fromDateStr ? new Date(fromDateStr) : null;
        let toDate = toDateStr ? new Date(toDateStr) : null;
        let activeCols = getActiveColumns();

        filteredData = rawData.filter(item => {
            let row = item.values;
            let rowText = row.join(" ").toLowerCase();
            if (kw && !rowText.includes(kw)) return false;

            if (kwCustomer) {
                let matchCus = false;
                activeCols.forEach((col, i) => {
                    if ((col.customer || col.ncc || col.code) && row[i] && String(row[i]).toLowerCase().includes(kwCustomer)) {
                        matchCus = true;
                    }
                });
                if (!matchCus) return false;
            }

            if (fromDate || toDate) {
                let dateIdx = activeCols.findIndex(c => c.date);
                if (dateIdx !== -1 && row[dateIdx]) {
                    let dateStr = String(row[dateIdx]);
                    let rowDate = new Date(dateStr);
                    if (isNaN(rowDate.getTime())) {
                        let parts = dateStr.split(/[-/]/);
                        if(parts.length === 3) {
                            if (parts[0].length === 4) rowDate = new Date(parts[0], parts[1]-1, parts[2]);
                            else rowDate = new Date(parts[2], parts[1]-1, parts[0]);
                        }
                    }
                    if (rowDate && !isNaN(rowDate)) {
                        if (fromDate && rowDate < fromDate) return false;
                        if (toDate && rowDate > toDate) return false;
                    }
                }
            }
            return true;
        });

        currentPage = 1;
        renderTablePage();
    }

    // XÓA TRẮNG BỘ LỌC
    function resetFilters(reload = true) {
        document.getElementById('globalSearchInput').value = '';
        document.getElementById('customerFilterInput').value = '';
        document.getElementById('fromDateInput').value = '';
        document.getElementById('toDateInput').value = '';
        if (reload) applyFilters();
    }

    // VẼ PHẦN NỘI DUNG BẢNG CHO TRANG HIỆN TẠI
    function renderTablePage() {
        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let start = (currentPage - 1) * pageSize;
        let end = start + pageSize;
        let pageData = filteredData.slice(start, end);
        
        pageData.forEach((item) => appendRowToTable(item.values, item.sheetRowIndex));
        
        document.getElementById('rowCountBadge').innerText = `Hiển thị: ${filteredData.length} / ${rawData.length} dòng`;
        renderPaginationControls();
        renderTableFooter();
    }

    // TẠO 1 DÒNG DỮ LIỆU
    function appendRowToTable(row, sheetRowIndex) {
        let activeCols = getActiveColumns();
        let tr = document.createElement('tr');
        tr.setAttribute('data-sheet-row', sheetRowIndex);
        
        let actionTd = document.createElement('td');
        actionTd.className = 'text-center';
        actionTd.innerHTML = `
            <button class="btn btn-sm btn-outline-primary btn-edit" onclick="editRow(this)" title="Sửa dòng này"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-success btn-save" style="display:none;" onclick="saveRow(this)" title="Lưu lại"><i class="fa-solid fa-floppy-disk"></i></button>
        `;
        tr.appendChild(actionTd);

        activeCols.forEach((col, i) => {
            let td = document.createElement('td');
            let val = row[i] !== undefined && row[i] !== null ? row[i] : '';
            td.setAttribute('data-raw-val', val);
            td.setAttribute('title', val);
            
            if (col.numeric) {
                td.className = 'text-right fw-semibold';
                td.innerText = col.percent ? formatPercent(val) : formatNumberVN(val);
            } else if (col.date) {
                td.className = 'text-center';
                if (val && typeof val === 'string' && val.includes('T')) {
                    td.innerText = new Date(val).toLocaleDateString('vi-VN');
                } else {
                    td.innerText = val;
                }
            } else {
                td.innerText = val;
            }
            
            tr.appendChild(td);
        });
        
        document.getElementById('tableBody').appendChild(tr);
    }

    // VẼ DÒNG TÍNH TỔNG DƯỚI CÙNG (FOOTER)
    function renderTableFooter() {
        let activeCols = getActiveColumns();
        let tfoot = document.getElementById('tableFooter');
        if (filteredData.length === 0) {
            tfoot.innerHTML = '';
            return;
        }

        let html = '<tr><th class="text-center">TỔNG CỘNG</th>';
        
        activeCols.forEach((col, i) => {
            if (col.numeric && !col.percent) {
                let sum = filteredData.reduce((acc, item) => {
                    let val = String(item.values[i] || '0').replace(/[,.]/g, ''); 
                    let num = parseFloat(val);
                    return acc + (isNaN(num) ? 0 : num);
                }, 0);
                html += `<th class="text-right">${formatNumberVN(sum)}</th>`;
            } else {
                html += `<th></th>`;
            }
        });
        
        html += '</tr>';
        tfoot.innerHTML = html;
    }

    // ĐIỀU KHIỂN NÚT CHUYỂN TRANG
    function renderPaginationControls() {
        let totalPages = Math.ceil(filteredData.length / pageSize) || 1;
        document.getElementById('pageInfoSpan').innerText = `Trang ${currentPage} / ${totalPages}`;
        
        let ul = document.getElementById('paginationControls');
        ul.innerHTML = '';
        
        let prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">Trước</a>`;
        ul.appendChild(prevLi);
        
        let maxVisible = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);
        
        if (endPage - startPage + 1 < maxVisible) {
            startPage = Math.max(1, endPage - maxVisible + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            let li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>`;
            ul.appendChild(li);
        }
        
        let nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">Sau</a>`;
        ul.appendChild(nextLi);
    }

    // RESIZER CHO CỘT
    function initResizer() {
        const thElms = document.querySelectorAll('#dataTable th');
        
        thElms.forEach(function(th, colIndex) {
            let resizer = th.querySelector('.resizer');
            if (!resizer) return;

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();

                let startX = e.pageX;
                let startWidth = th.offsetWidth;

                resizer.classList.add('resizing');

                function mouseMoveHandler(e) {
                    let newWidth = Math.max(20, startWidth + (e.pageX - startX));
                    
                    th.style.setProperty('width', `${newWidth}px`, 'important');
                    th.style.setProperty('min-width', `${newWidth}px`, 'important');
                    th.style.setProperty('max-width', `${newWidth}px`, 'important');

                    const rows = document.querySelectorAll('#dataTable tbody tr, #dataTable tfoot tr');
                    rows.forEach(row => {
                        if (row.cells[colIndex]) {
                            row.cells[colIndex].style.setProperty('width', `${newWidth}px`, 'important');
                            row.cells[colIndex].style.setProperty('min-width', `${newWidth}px`, 'important');
                            row.cells[colIndex].style.setProperty('max-width', `${newWidth}px`, 'important');
                        }
                    });
                }

                function mouseUpHandler() {
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                    resizer.classList.remove('resizing');
                }

                document.addEventListener('mousemove', mouseMoveHandler);
                document.addEventListener('mouseup', mouseUpHandler);
            });
        });
    }

    // CHUYỂN TRANG
    function goToPage(page) {
        currentPage = page;
        renderTablePage();
    }

    // THAY ĐỔI SỐ DÒNG HIỂN THỊ
    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        currentPage = 1;
        renderTablePage();
    }

    // CHẾ ĐỘ SỬA DÒNG
// CHẾ ĐỘ SỬA DÒNG (ĐÃ SỬA LỖI HIỂN THỊ NGÀY)
function editRow(btn) {
    var tr = btn.closest('tr');
    var cells = tr.querySelectorAll('td');
    var activeCols = getActiveColumns();

    for (var i = 1; i < cells.length; i++) {
        var colIdx = i - 1;
        var colConfig = activeCols[colIdx];
        var rawVal = cells[i].getAttribute('data-raw-val') || cells[i].innerText.trim();

        if (colConfig && colConfig.date) {
            // Chuyển đổi giá trị về chuẩn YYYY-MM-DD để hiển thị lên input date
            var formattedDate = formatDateForInput(rawVal);
            cells[i].innerHTML = `<input type="date" class="editable-input" value="${formattedDate}">`;
        } else {
            cells[i].innerHTML = `<input type="text" class="editable-input" value="${rawVal}">`;
        }
    }

    tr.querySelector('.btn-edit').style.display = 'none';
    tr.querySelector('.btn-save').style.display = 'inline-block';
}

    // LƯU CẬP NHẬT DÒNG
    function saveRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var sheetRowIndex = parseInt(tr.getAttribute('data-sheet-row'));

        var fullRowData = [];
        for (var i = 1; i < cells.length; i++) {
            var input = cells[i].querySelector('input');
            var val = input ? input.value.trim() : cells[i].innerText.trim();
            fullRowData.push(val);
        }

        showLoading(true, `Đang ghi dữ liệu vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "updateRow",
            sheetName: currentMode,
            rowIndex: sheetRowIndex,
            rowData: fullRowData
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                alert("Đã lưu dữ liệu thành công!");
                loadDataFromSheet();
            }, 1200);
        })
        .catch(err => {
            showLoading(false);
            alert("Lỗi lưu dữ liệu!");
        });
    }

    // THÊM DÒNG MỚI
    function addRow() {
        var activeCols = getActiveColumns();
        var emptyRow = new Array(activeCols.length).fill('');
        if (currentMode === 'BAN_HANG') {
            var now = new Date().toISOString().split('T')[0];
            emptyRow[2] = now;
            emptyRow[14] = 'Cái';
            emptyRow[15] = 'Không';
        }

        showLoading(true, `Đang thêm dòng mới vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "appendRows",
            sheetName: currentMode,
            rows: [emptyRow]
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                loadDataFromSheet();
            }, 1200);
        });
    }
    // Hàm chuyển đổi chuỗi ngày bất kỳ về định dạng YYYY-MM-DD cho input[type=date]
function formatDateForInput(dateStr) {
    if (!dateStr) return '';
    
    // Nếu đã là chuỗi ISO chứa 'T' (ví dụ 2026-09-26T00:00:00.000Z)
    if (typeof dateStr === 'string' && dateStr.includes('T')) {
        return dateStr.split('T')[0];
    }
    
    // Nếu là định dạng DD/MM/YYYY hoặc DD-MM-YYYY
    let parts = String(dateStr).trim().split(/[/.-]/);
    if (parts.length === 3) {
        // Trường hợp YYYY/MM/DD
        if (parts[0].length === 4) {
            let y = parts[0];
            let m = parts[1].padStart(2, '0');
            let d = parts[2].padStart(2, '0');
            return `${y}-${m}-${d}`;
        } 
        // Trường hợp DD/MM/YYYY
        else if (parts[2].length === 4) {
            let d = parts[0].padStart(2, '0');
            let m = parts[1].padStart(2, '0');
            let y = parts[2];
            return `${y}-${m}-${d}`;
        }
    }
    
    // Thử dùng Date() chuẩn
    let d = new Date(dateStr);
    if (!isNaN(d.getTime())) {
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    
    return '';
}

    // XỬ LÝ TẢI FILE EXCEL LÊN SHEET
    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var activeCols = getActiveColumns();

        var reader = new FileReader();
        reader.onload = async function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });
            var worksheet = workbook.Sheets[workbook.SheetNames[0]];
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            var rawRows = excelData.slice(1).filter(r => r.length > 0 && r.some(cell => cell !== null && cell !== ''));

            if (rawRows.length === 0) {
                alert("File Excel không chứa dữ liệu!");
                return;
            }

            var formattedRows = rawRows.map(row => {
                var newRow = [];
                for (var i = 0; i < activeCols.length; i++) {
                    var cellVal = row[i] !== undefined && row[i] !== null ? row[i] : '';
                    newRow.push(String(cellVal));
                }
                return newRow;
            });

            var BATCH_SIZE = 100;
            var totalRows = formattedRows.length;

            showLoading(true, `Đang đẩy ${totalRows} dòng vào Sheet '${currentMode}'...`);

            for (var i = 0; i < totalRows; i += BATCH_SIZE) {
                var chunk = formattedRows.slice(i, i + BATCH_SIZE);
                var formData = new URLSearchParams();
                formData.append("payload", JSON.stringify({
                    action: "appendRows",
                    sheetName: currentMode,
                    rows: chunk
                }));

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData.toString()
                    });
                } catch (err) {}
            }

            setTimeout(() => {
                showLoading(false);
                alert(`Đã hoàn tất tải lên file Excel vào Sheet '${currentMode}'!`);
                loadDataFromSheet();
            }, 1500);

            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }

    // TỰ ĐỘNG CHẠY KHI MỞ TRANG
    window.onload = function() {
        loadDataFromSheet();
    };
</script>
