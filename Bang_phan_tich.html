<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS đọc file Excel -->

    <style>
        /* Ép toàn bộ trang không tạo thêm thanh cuộn ngoài */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important; 
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
        }

        .table-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        /* 1. KHUNG BAO BẢNG CÓ THANH CUỘN DUY NHẤT */
        .table-responsive {
            flex: 1 1 auto;
            overflow-x: auto !important;
            overflow-y: auto !important;
            width: 100% !important;
            border: 1px solid #dee2e6;
            margin-bottom: 10px;
        }

        /* 2. Cấu hình bảng co dãn linh hoạt */
        #dataTable {
            table-layout: fixed !important;
            width: max-content !important;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 1.05rem;
        }

        /* 3. Tiêu đề (Bật Wrap Text cho tiêu đề) */
        #dataTable thead tr.header-row th {
            position: sticky !important;
            top: 0;
            z-index: 12;
            background-color: #f1f5f9;
            font-size: 1.02rem;
            font-weight: 700;
            white-space: normal !important; /* CHO PHÉP WRAP TEXT TỰ ĐỘNG XUỐNG DÒNG */
            word-wrap: break-word !important;
            vertical-align: middle !important;
            text-align: center;
            line-height: 1.2;
            padding: 6px 4px !important;
        }

        /* Ô dữ liệu dưới bảng */
        #dataTable td {
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            box-sizing: border-box !important;
            padding: 6px 8px !important;
        }

        /* Sticky cho Hàng Lọc Cột */
        #dataTable thead tr.filter-row th {
            position: sticky !important;
            top: 45px;
            z-index: 11;
            background-color: #e2e8f0;
            padding: 3px 4px !important;
        }

        #dataTable th {
            user-select: none;
            -webkit-user-select: none;
            min-width: 0 !important;
        }

        /* Vạch kéo Resizer ở cạnh phải mỗi cột */
        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 100%;
            cursor: col-resize !important;
            user-select: none;
            z-index: 13;
        }

        .resizer:hover,
        .resizer.resizing {
            border-right: 3px solid #0d6efd !important;
            background-color: rgba(13, 110, 253, 0.1);
        }

        /* Ô nhập liệu khi Edit hoặc Filter trong cột */
        #dataTable td input.editable-input,
        .column-filter-input {
            width: 100% !important;
            box-sizing: border-box !important;
            border: 1px solid #ced4da;
            padding: 2px 4px;
            font-size: 0.95rem !important;
            border-radius: 3px;
        }

        .column-filter-input:focus {
            border-color: #0d6efd;
            outline: none;
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.25);
        }

        .text-right { text-align: right; }
        .text-center { text-align: center; }

        /* Sticky Footer Tính Tổng */
        tfoot th, tfoot td {
            position: sticky;
            bottom: 0;
            background-color: #e9ecef !important;
            color: #0d6efd;
            font-weight: bold;
            font-size: 1.05rem;
            z-index: 9;
            border-top: 2px solid #0d6efd !important;
            border-bottom: 1px solid #dee2e6;
        }

        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; }

        /* KHUNG BỘ LỌC PHÍA TRÊN */
        .filter-card { 
            background: #eef2f7; 
            border-radius: 6px; 
            padding: 10px 15px; 
            margin-bottom: 10px; 
            border: 1px solid #cbd5e1;
            flex-shrink: 0;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 8px;
            border-top: 1px solid #dee2e6;
            flex-shrink: 0;
            font-size: 1rem;
        }

        .view-mode-btn-group .btn { font-weight: 600; font-size: 0.95rem; }
        .view-mode-btn-group .btn.active { box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }

</head>

<!-- Loading Spinner -->

        <!-- BỘ LỌC 1: PHÍA TRÊN -->

                <div class="col-md-2">

                </div>
                <div class="col-md-3">

                </div>

                </div>

        </div>
        
        <!-- NÚT THAO TÁC -->
        <div class="row mb-2" style="flex-shrink: 0;">
            <div class="col-md-6 d-flex gap-2">
                <button class="btn btn-sm btn-success" onclick="addRow()"><i class="fa-solid fa-plus me-1"></i>Thêm Dòng Mới</button>
                <button class="btn btn-sm btn-primary" onclick="loadDataFromSheet(true)"><i class="fa-solid fa-rotate me-1"></i>Tải Lại Sheet Này</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end gap-2">

        </div>

            <table class="table table-bordered table-hover align-middle" id="dataTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFooter"></tfoot>

        </div>

        <!-- PHÂN TRANG -->
        <div class="pagination-container">
            <div class="d-flex align-items-center gap-2">

                <select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;" onchange="changePageSize()">

                </select>

            </div>

            <nav>

            </nav>
        </div>
    </div>
</div>

            'TON_KHO': { id: 'btnModeTonKho', cls: 'btn-info' },
            'BANG_GIA_DELL': { id: 'btnModeBaoGia1', cls: 'btn-warning' },
            'BANG_GIA_HP': { id: 'btnModeBaoGia2', cls: 'btn-warning' },
            'BANG_GIA_LENOVO': { id: 'btnModeBaoGia3', cls: 'btn-warning' }
        }[mode];

        let targetBtn = document.getElementById(btnObj.id);
        targetBtn.className = `btn ${btnObj.cls} active`;
        
        let cols = getActiveColumns();
        document.getElementById('modeDescription').innerText = `Đang hiển thị Trang tính: ${mode} (${cols.length} Cột)`;
        
        resetAllFilters(false);
        loadDataFromSheet();
    }

    function showLoading(show, text = "Đang nạp dữ liệu từ Google Sheets...") {
        document.getElementById('loadingSpinner').style.display = show ? 'flex' : 'none';
        document.getElementById('spinnerText').innerText = text;
    }

    function loadDataFromSheet(forceRefresh = false) {
        let cacheKey = `CACHE_DATA_${currentMode}`;
        let cachedData = localStorage.getItem(cacheKey);

        if (cachedData && !forceRefresh) {
            let parsed = JSON.parse(cachedData);
            processDataArray(parsed);
            renderTableHeader();
            applyAllFilters();
        } else {
            showLoading(true, `Đang tải dữ liệu Sheet ${currentMode}...`);
        }

        fetch(`${GOOGLE_SCRIPT_URL}?action=getData&sheetName=${currentMode}`)
            .then(res => res.json())
            .then(data => {
                localStorage.setItem(cacheKey, JSON.stringify(data));
                processDataArray(data);
                renderTableHeader();
                applyAllFilters();
                showLoading(false);
            })
            .catch(err => {
                showLoading(false);
            });
    }

    function processDataArray(data) {
        if (!data || data.length === 0) {
            rawData = [];
            filteredData = [];
            return;
        }
        rawData = data.slice(1).map((row, index) => {
            return {
                sheetRowIndex: index + 2,
                values: row
            };
        });
        filteredData = [...rawData];
    }

    function renderTableHeader() {
        let cols = getActiveColumns();
        let thead = document.getElementById('tableHeader');
        
        let htmlHeader = '<tr class="header-row"><th style="width: 75px;" class="text-center">Thao tác</th>';
        cols.forEach((col) => {
            let defaultWidth = col.desc ? '220px' : (col.customer || col.ncc) ? '170px' : '110px';
            htmlHeader += `<th style="width: ${defaultWidth};">${col.label} <div class="resizer"></div></th>`;
        });
        htmlHeader += '</tr>';

        let htmlFilter = '<tr class="filter-row"><th class="text-center"><i class="fa-solid fa-filter text-muted"></i></th>';
        cols.forEach((col, idx) => {
            let currentVal = columnFilters[idx] || '';
            let placeholder = 'Lọc...';
            htmlFilter += `<th><input type="text" class="column-filter-input" data-col-idx="${idx}" value="${currentVal}" placeholder="${placeholder}" onkeyup="onColumnFilterChange(this)"></th>`;
        });
        htmlFilter += '</tr>';

        thead.innerHTML = htmlHeader + htmlFilter;
        
        setTimeout(() => {
            let headerRow = thead.querySelector('tr.header-row');
            if (headerRow) {
                let h = headerRow.offsetHeight;
                let filterRow = thead.querySelector('tr.filter-row');
                if (filterRow) {
                    filterRow.querySelectorAll('th').forEach(th => {
                        th.style.top = `${h}px`;
                    });
                }
            }
        }, 50);

        initResizer();
    }

    function onColumnFilterChange(input) {
        let colIdx = parseInt(input.getAttribute('data-col-idx'));
        let val = input.value.trim().toLowerCase();
        
        if (val) {
            columnFilters[colIdx] = val;
        } else {
            delete columnFilters[colIdx];
        }
        
        applyAllFilters();
    }

    function applyAllFilters() {
        let kw = document.getElementById('globalSearchInput').value.toLowerCase();
        let kwCustomer = document.getElementById('customerFilterInput').value.toLowerCase();
        let fromDateStr = document.getElementById('fromDateInput').value;
        let toDateStr = document.getElementById('toDateInput').value;
        
        let fromDate = fromDateStr ? new Date(fromDateStr) : null;
        let toDate = toDateStr ? new Date(toDateStr) : null;
        let activeCols = getActiveColumns();
        let filterKeys = Object.keys(columnFilters);

        filteredData = rawData.filter(item => {
            let row = item.values;

            if (filterKeys.length > 0) {
                let matchColumns = filterKeys.every(colIdx => {
                    let searchVal = columnFilters[colIdx];
                    let cellVal = row[colIdx] !== undefined && row[colIdx] !== null ? String(row[colIdx]).toLowerCase() : '';
                    return cellVal.includes(searchVal);
                });
                if (!matchColumns) return false;
            }

            let rowText = row.join(" ").toLowerCase();
            if (kw && !rowText.includes(kw)) return false;

            if (kwCustomer) {
                let matchCus = false;
                activeCols.forEach((col, i) => {
                    if ((col.customer || col.ncc || col.code) && row[i] && String(row[i]).toLowerCase().includes(kwCustomer)) {
                        matchCus = true;
                    }
                });
                if (!matchCus) return false;
            }

            if (fromDate || toDate) {
                let dateIdx = activeCols.findIndex(c => c.date);
                if (dateIdx !== -1 && row[dateIdx]) {
                    let dateStr = String(row[dateIdx]);
                    let rowDate = new Date(dateStr);
                    if (isNaN(rowDate.getTime())) {
                        let parts = dateStr.split(/[-/]/);
                        if(parts.length === 3) {
                            if (parts[0].length === 4) rowDate = new Date(parts[0], parts[1]-1, parts[2]);
                            else rowDate = new Date(parts[2], parts[1]-1, parts[0]);
                        }
                    }
                    if (rowDate && !isNaN(rowDate)) {
                        if (fromDate && rowDate < fromDate) return false;
                        if (toDate && rowDate > toDate) return false;
                    }
                }
            }

            return true;
        });

        currentPage = 1;
        renderTablePage();
    }

    function resetAllFilters(reload = true) {
        document.getElementById('globalSearchInput').value = '';
        document.getElementById('customerFilterInput').value = '';
        document.getElementById('fromDateInput').value = '';
        document.getElementById('toDateInput').value = '';
        columnFilters = {};
        document.querySelectorAll('.column-filter-input').forEach(input => input.value = '');
        if (reload) applyAllFilters();
    }

    function formatNumberVN(val) {
        if (val === null || val === undefined || val === '' || isNaN(val)) return val;
        return Number(val).toLocaleString('vi-VN');
    }

    function formatPercent(val) {
        if (val === null || val === undefined || val === '') return '';
        let cleanVal = String(val).replace('%', '').trim();
        let num = parseFloat(cleanVal);
        if (isNaN(num)) return val;
        if (Math.abs(num) > 1) {
            num = num / 100;
        }
        return new Intl.NumberFormat('vi-VN', {
            style: 'percent',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num);
    }

    function formatDateForInput(dateStr) {
        if (!dateStr) return '';
        if (typeof dateStr === 'string' && dateStr.includes('T')) {
            return dateStr.split('T')[0];
        }
        let parts = String(dateStr).trim().split(/[/.-]/);
        if (parts.length === 3) {
            if (parts[0].length === 4) {
                let y = parts[0];
                let m = parts[1].padStart(2, '0');
                let d = parts[2].padStart(2, '0');
                return `${y}-${m}-${d}`;
            } else if (parts[2].length === 4) {
                let d = parts[0].padStart(2, '0');
                let m = parts[1].padStart(2, '0');
                let y = parts[2];
                return `${y}-${m}-${d}`;
            }
        }
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
            let year = d.getFullYear();
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        return '';
    }

    function renderTablePage() {
        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let start = (currentPage - 1) * pageSize;
        let end = start + pageSize;
        let pageData = filteredData.slice(start, end);
        
        let fragment = document.createDocumentFragment();
        pageData.forEach((item) => {
            let tr = createRowNode(item.values, item.sheetRowIndex);
            fragment.appendChild(tr);
        });
        tbody.appendChild(fragment);
        
        document.getElementById('rowCountBadge').innerText = `Hiển thị: ${filteredData.length} / ${rawData.length} dòng`;
        renderPaginationControls();
        renderTableFooter();
    }

function createRowNode(row, sheetRowIndex) {
    let activeCols = getActiveColumns();
    let tr = document.createElement('tr');
    tr.setAttribute('data-sheet-row', sheetRowIndex);
    
    let actionTd = document.createElement('td');
    actionTd.className = 'text-center';
    actionTd.innerHTML = `
        <button class="btn btn-sm btn-outline-primary btn-edit" onclick="editRow(this)" title="Sửa dòng này"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-sm btn-success btn-save" style="display:none;" onclick="saveRow(this)" title="Lưu lại"><i class="fa-solid fa-floppy-disk"></i></button>
    `;
    tr.appendChild(actionTd);

    activeCols.forEach((col, i) => {
        let td = document.createElement('td');
        let val = row[i] !== undefined && row[i] !== null ? row[i] : '';
        td.setAttribute('data-raw-val', val);
        td.setAttribute('title', val);
        
        if (col.numeric) {
            td.className = 'text-right fw-semibold';
            if (col.percent) {
                td.innerText = formatPercent(val);
            } else if (typeof val === 'number' && !Number.isInteger(val) && val < 100) {
                td.innerText = val;
            } else {
                td.innerText = formatNumberVN(val);
            }
        } else if (col.date) {
            td.className = 'text-center';
            if (val) {
                let d = new Date(val);
                // Nếu là dạng chuỗi ISO có chữ T
                if (typeof val === 'string' && val.includes('T')) {
                    td.innerText = !isNaN(d.getTime()) ? d.toLocaleDateString('vi-VN') : val;
                } else if (!isNaN(d.getTime()) && isNaN(val)) {
                    td.innerText = d.toLocaleDateString('vi-VN');
                } else {
                    td.innerText = val;
                }
            } else {
                td.innerText = '';
            }
        } else {
            td.innerText = val;
        }
        
        tr.appendChild(td);
    });
    return tr;
}

    function renderTableFooter() {
        let activeCols = getActiveColumns();
        let tfoot = document.getElementById('tableFooter');
        if (filteredData.length === 0) {
            tfoot.innerHTML = '';
            return;
        }

        let html = '<tr><th class="text-center">TỔNG CỘNG</th>';
        
        activeCols.forEach((col, i) => {
            if (col.numeric && !col.percent) {
                let sum = filteredData.reduce((acc, item) => {
                    let val = String(item.values[i] || '0').replace(/[,.]/g, ''); 
                    let num = parseFloat(val);
                    return acc + (isNaN(num) ? 0 : num);
                }, 0);
                html += `<th class="text-right">${formatNumberVN(sum)}</th>`;
            } else {
                html += `<th></th>`;
            }
        });
        
        html += '</tr>';
        tfoot.innerHTML = html;
    }

    function renderPaginationControls() {
        let totalPages = Math.ceil(filteredData.length / pageSize) || 1;
        document.getElementById('pageInfoSpan').innerText = `Trang ${currentPage} / ${totalPages}`;
        
        let ul = document.getElementById('paginationControls');
        ul.innerHTML = '';
        
        let prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">Trước</a>`;
        ul.appendChild(prevLi);
        
        let maxVisible = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);
        
        if (endPage - startPage + 1 < maxVisible) {
            startPage = Math.max(1, endPage - maxVisible + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            let li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>`;
            ul.appendChild(li);
        }
        
        let nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">Sau</a>`;
        ul.appendChild(nextLi);
    }

    function initResizer() {
        const headerThs = document.querySelectorAll('#dataTable thead tr.header-row th');
        const filterThs = document.querySelectorAll('#dataTable thead tr.filter-row th');
        
        headerThs.forEach(function(th, colIndex) {
            let resizer = th.querySelector('.resizer');
            if (!resizer) return;

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();

                let startX = e.pageX;
                let startWidth = th.offsetWidth;

                resizer.classList.add('resizing');

                function mouseMoveHandler(e) {
                    let newWidth = Math.max(30, startWidth + (e.pageX - startX));
                    let widthPx = `${newWidth}px`;
                    
                    th.style.setProperty('width', widthPx, 'important');
                    th.style.setProperty('min-width', widthPx, 'important');
                    th.style.setProperty('max-width', widthPx, 'important');

                    if (filterThs[colIndex]) {
                        filterThs[colIndex].style.setProperty('width', widthPx, 'important');
                        filterThs[colIndex].style.setProperty('min-width', widthPx, 'important');
                        filterThs[colIndex].style.setProperty('max-width', widthPx, 'important');
                    }

                    const rows = document.querySelectorAll('#dataTable tbody tr, #dataTable tfoot tr');
                    rows.forEach(row => {
                        if (row.cells[colIndex]) {
                            row.cells[colIndex].style.setProperty('width', widthPx, 'important');
                            row.cells[colIndex].style.setProperty('min-width', widthPx, 'important');
                            row.cells[colIndex].style.setProperty('max-width', widthPx, 'important');
                        }
                    });
                }

                function mouseUpHandler() {
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                    resizer.classList.remove('resizing');
                }

                document.addEventListener('mousemove', mouseMoveHandler);
                document.addEventListener('mouseup', mouseUpHandler);
            });
        });
    }

    function goToPage(page) {
        currentPage = page;
        renderTablePage();
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        currentPage = 1;
        renderTablePage();
    }

    function editRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var activeCols = getActiveColumns();

        for (var i = 1; i < cells.length; i++) {
            var colIdx = i - 1;
            var colConfig = activeCols[colIdx];
            var rawVal = cells[i].getAttribute('data-raw-val') || cells[i].innerText.trim();

            if (colConfig && colConfig.date) {
                var formattedDate = formatDateForInput(rawVal);
                cells[i].innerHTML = `<input type="date" class="editable-input" value="${formattedDate}">`;
            } else {
                cells[i].innerHTML = `<input type="text" class="editable-input" value="${rawVal}">`;
            }
        }

        tr.querySelector('.btn-edit').style.display = 'none';
        tr.querySelector('.btn-save').style.display = 'inline-block';
    }

    function saveRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var sheetRowIndex = parseInt(tr.getAttribute('data-sheet-row'));

        var fullRowData = [];
        for (var i = 1; i < cells.length; i++) {
            var input = cells[i].querySelector('input');
            var val = input ? input.value.trim() : cells[i].innerText.trim();
            fullRowData.push(val);
        }

        showLoading(true, `Đang ghi dữ liệu vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "updateRow",
            sheetName: currentMode,
            rowIndex: sheetRowIndex,
            rowData: fullRowData
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                alert("Đã lưu dữ liệu thành công!");
                loadDataFromSheet(true);
            }, 1200);
        })
        .catch(err => {
            showLoading(false);
            alert("Lỗi lưu dữ liệu!");
        });
    }

    function addRow() {
        var activeCols = getActiveColumns();
        var emptyRow = new Array(activeCols.length).fill('');

        showLoading(true, `Đang thêm dòng mới vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "appendRows",
            sheetName: currentMode,
            rows: [emptyRow]
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                loadDataFromSheet(true);
            }, 1200);
        });
    }

    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var activeCols = getActiveColumns();

        var reader = new FileReader();
        reader.onload = async function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });
            var worksheet = workbook.Sheets[workbook.SheetNames[0]];
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            var rawRows = excelData.slice(1).filter(r => r.length > 0 && r.some(cell => cell !== null && cell !== ''));

            if (rawRows.length === 0) {
                alert("File Excel không chứa dữ liệu!");
                return;
            }

            var formattedRows = rawRows.map(row => {
                var newRow = [];
                for (var i = 0; i < activeCols.length; i++) {
                    var cellVal = row[i] !== undefined && row[i] !== null ? row[i] : '';
                    newRow.push(String(cellVal));
                }
                return newRow;
            });

            var BATCH_SIZE = 100;
            var totalRows = formattedRows.length;

            showLoading(true, `Đang đẩy ${totalRows} dòng vào Sheet '${currentMode}'...`);

            for (var i = 0; i < totalRows; i += BATCH_SIZE) {
                var chunk = formattedRows.slice(i, i + BATCH_SIZE);
                var formData = new URLSearchParams();
                formData.append("payload", JSON.stringify({
                    action: "appendRows",
                    sheetName: currentMode,
                    rows: chunk
                }));

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData.toString()
                    });
                } catch (err) {}
            }

            setTimeout(() => {
                showLoading(false);
                alert(`Đã hoàn tất tải lên file Excel vào Sheet '${currentMode}'!`);
                loadDataFromSheet(true);
            }, 1500);

            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }

    window.onload = function() {
        loadDataFromSheet();
    };
</script>
