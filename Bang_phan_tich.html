<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Kho & Phân Tích Dữ Liệu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SheetJS đọc file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-container { background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 62vh; overflow-y: auto; position: relative; border: 1px solid #dee2e6; border-radius: 6px; }
        
        /* Header Cố Định */
        th { background-color: #0d6efd !important; color: white !important; position: sticky; top: 0; z-index: 10; white-space: nowrap; font-size: 0.85rem; }
        td { vertical-align: middle; white-space: nowrap; font-size: 0.85rem; }
        
        .editable-input { width: 100%; min-width: 80px; padding: 2px 5px; border: 1px solid #0d6efd; border-radius: 4px; font-size: 0.85rem; }
        .filter-input { width: 100%; min-width: 70px; padding: 2px 5px; font-size: 0.8rem; border-radius: 4px; border: 1px solid #ced4da; }
        
        .col-ncc { max-width: 250px !important; min-width: 100px !important; white-space: normal !important; word-break: break-word !important; }
        .col-code { max-width: 400px !important; min-width: 250px !important; white-space: normal !important; word-break: break-all !important; font-family: monospace, sans-serif; font-weight: 600; }
        .col-desc { max-width: 250px !important; min-width: 180px !important; white-space: normal !important; word-break: break-word !important; }

        .text-right { text-align: right; }
        .text-center { text-align: center; }

        /* Sticky Footer Tính Tổng */
        tfoot th, tfoot td {
            position: sticky;
            bottom: 0;
            background-color: #e9ecef !important;
            color: #0d6efd;
            font-weight: bold;
            z-index: 9;
            border-top: 2px solid #0d6efd !important;
            border-bottom: 1px solid #dee2e6;
        }

        #loadingSpinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; }
        .filter-card { background: #eef2f7; border-radius: 6px; padding: 15px; margin-bottom: 15px; }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }

        .view-mode-btn-group .btn { font-weight: 600; }
        .view-mode-btn-group .btn.active { box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<!-- Loading Spinner -->
<div id="loadingSpinner">
    <div class="text-center">
        <div class="spinner-border text-primary" style="width: 3.5rem; height: 3.5rem;" role="status"></div>
        <div class="mt-2 fw-bold text-dark" id="spinnerText">Đang nạp dữ liệu từ Google Sheets...</div>
    </div>
</div>

<div class="container-fluid my-3">
    <div class="table-container">
        
        <!-- HEADER TRANG & NÚT CHUYỂN TAB CẢ 4 SHEET -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div>
                <h4 class="text-primary fw-bold m-0"><i class="fa-solid fa-boxes-packing me-2"></i>Quản Lý Dữ Liệu Dùng Chung</h4>
                <small class="text-muted" id="modeDescription">Đang hiển thị Trang tính: NHAP_KHO (17 Cột)</small>
            </div>
            
            <div class="btn-group view-mode-btn-group" role="group">
                <button type="button" id="btnModeNhapKho" class="btn btn-primary active" onclick="switchTableMode('NHAP_KHO')">
                    <i class="fa-solid fa-file-import me-1"></i> NHẬP KHO (17 Cột)
                </button>
                <button type="button" id="btnModeLaptop" class="btn btn-outline-warning" onclick="switchTableMode('LAPTOP')">
                    <i class="fa-solid fa-laptop me-1"></i> LAPTOP (30 Cột)
                </button>
                <button type="button" id="btnModePc" class="btn btn-outline-dark" onclick="switchTableMode('PC')">
                    <i class="fa-solid fa-desktop me-1"></i> PC (27 Cột)
                </button>
                <button type="button" id="btnModeTonKho" class="btn btn-outline-info" onclick="switchTableMode('TON_KHO')">
                    <i class="fa-solid fa-warehouse me-1"></i> TỒN KHO (11 Cột)
                </button>
            </div>

            <span class="badge bg-info text-dark fs-6" id="rowCountBadge">Hiển thị: 0 / 0 dòng</span>
        </div>

        <!-- BỘ LỌC TÌM KIẾM NÂNG CAO -->
        <div class="filter-card">
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-magnifying-glass me-1"></i>Tìm kiếm nhanh:</label>
                    <input type="text" id="globalSearchInput" class="form-control form-control-sm" placeholder="Nhập từ khóa bất kỳ..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-calendar me-1"></i>Từ ngày:</label>
                    <input type="date" id="fromDateInput" class="form-control form-control-sm" onchange="applyFilters()">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-calendar me-1"></i>Đến ngày:</label>
                    <input type="date" id="toDateInput" class="form-control form-control-sm" onchange="applyFilters()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold mb-1 small"><i class="fa-solid fa-truck-field me-1"></i>Mã / Tên NCC / Mã Hàng:</label>
                    <input type="text" id="nccFilterInput" class="form-control form-control-sm" placeholder="Tìm theo NCC hoặc Mã..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-sm btn-secondary w-100 mt-3" onclick="resetFilters()"><i class="fa-solid fa-rotate-left me-1"></i>Xóa bộ lọc</button>
                </div>
            </div>
        </div>
        
        <!-- NÚT THAO TÁC -->
        <div class="row mb-3">
            <div class="col-md-6 d-flex gap-2">
                <button class="btn btn-sm btn-success" onclick="addRow()"><i class="fa-solid fa-plus me-1"></i>Thêm Dòng Mới</button>
                <button class="btn btn-sm btn-primary" onclick="loadDataFromSheet()"><i class="fa-solid fa-rotate me-1"></i>Tải Lại Sheet Này</button>
            </div>
            <div class="col-md-6 d-flex justify-content-end gap-2">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
                <button class="btn btn-sm btn-outline-success" onclick="document.getElementById('excelFileInput').click()">
                    <i class="fa-solid fa-file-excel me-1"></i>Nhập Từ Excel Vào Sheet Này
                </button>
            </div>
        </div>

        <!-- BẢNG DỮ LIỆU -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle" id="dataTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFooter"></tfoot>
            </table>
        </div>

        <!-- PHÂN TRANG -->
        <div class="pagination-container">
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small">Hiển thị:</span>
                <select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;" onchange="changePageSize()">
                    <option value="25">25 dòng/trang</option>
                    <option value="50" selected>50 dòng/trang</option>
                    <option value="100">100 dòng/trang</option>
                    <option value="200">200 dòng/trang</option>
                    <option value="500">500 dòng/trang</option>
                </select>
                <span id="pageInfoSpan" class="text-muted small ms-2">Trang 0 / 0</span>
            </div>

            <nav>
                <ul class="pagination pagination-sm m-0" id="paginationControls"></ul>
            </nav>
        </div>

    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqE3DjuQkympRqxZLnRUhgs3LWDf3PgbAH000SUO3vYkB3QBaaJ5WCMmqJDQvdWELO/exec";

    // Bảng cấu hình các cột tương ứng từng Trang tính
    const SHEET_CONFIGS = {
        'NHAP_KHO': [
            { label: 'Ngày HT', date: true }, { label: 'Ngày CT', date: true }, { label: 'Số CT' }, { label: 'Ngày Hạn TT', date: true },
            { label: 'Mã NCC', ncc: true }, { label: 'Tên NCC', ncc: true }, { label: 'Diễn Giải', desc: true }, { label: 'Mã Hàng', code: true },
            { label: 'ĐVT' }, { label: 'Số Lượng', numeric: true }, { label: 'Đơn Giá', numeric: true }, { label: 'Thành Tiền', numeric: true },
            { label: 'Giá cost', numeric: true }, { label: 'Chiết khấu', numeric: true }, { label: 'Sell out', numeric: true },
            { label: 'Sell in', numeric: true }, { label: 'Tên nhóm VTHH', desc: true }
        ],
        'LAPTOP': [
            { label: 'NGÀNH HÀNG' }, { label: 'NCC' }, { label: 'Mã SKU NPP, Hãng' }, { label: 'Mã KTB' },
            { label: 'Brand' }, { label: 'Màn hình INCH' }, { label: 'chip' }, { label: 'ram' },
            { label: 'ssd' }, { label: 'win' }, { label: 'office' }, { label: 'Bao_Hanh Nam' },
            { label: 'FP' }, { label: 'PIN adapter' }, { label: 'led_KB_BK' }, { label: 'Alu' },
            { label: 'MX RTX' }, { label: 'So_Luong NHAP TONG', numeric: true }, { label: 'So_Luong TON', numeric: true },
            { label: 'số lượng bán ra', numeric: true }, { label: '% Loi Nhuan Tiền Mặt', numeric: true }, { label: '% Loi Nhuan Công Nợ', numeric: true },
            { label: 'Hàng gửi NPP' }, { label: 'COST_KTB', numeric: true }, { label: 'GIÁ NHẬP CŨ', numeric: true },
            { label: '% GIÁ NHẬP LỆCH', numeric: true }, { label: 'GIÁ NHẬP MỚI (VNĐ)', numeric: true },
            { label: 'GIÁ BÁN TIỀN MẶT', numeric: true }, { label: 'GIÁ BÁN CÔNG NỢ', numeric: true }, { label: 'NGÀY NHẬP TRƯỚC', date: true }
        ],
        'PC': [
            { label: 'NGÀNH HÀNG' }, { label: 'NCC' }, { label: 'Mã SKU NPP, Hãng' }, { label: 'Mã KTB' },
            { label: 'Brand' }, { label: 'chip' }, { label: 'ram' }, { label: 'ssd' },
            { label: 'win' }, { label: 'Bao_Hanh' }, { label: 'office' }, { label: 'So_Luong NHAP TONG', numeric: true },
            { label: 'So_Luong TON', numeric: true }, { label: 'SL BÁN TỪ NGÀY', numeric: true }, { label: '% Loi Nhuan Công Nợ', numeric: true },
            { label: 'Hàng gửi NPP' }, { label: 'COST_KTB', numeric: true }, { label: 'GIÁ NHẬP TRƯỚC', numeric: true },
            { label: '% GIÁ LỆCH TRƯỚC', numeric: true }, { label: 'GIÁ NHẬP (VNĐ)', numeric: true }, { label: '% Loi Nhuan Tiền Mặt', numeric: true },
            { label: '% Loi Nhuan Công nợ', numeric: true }, { label: 'GIÁ BÁN TIỀN MẶT', numeric: true }, { label: 'GIÁ BÁN CÔNG NỢ', numeric: true },
            { label: 'NGÀY NHẬP TRƯỚC', date: true }, { label: 'NGÀY NHẬP GẦN NHẤT', date: true }, { label: 'GIÁ ĐỀ XUẤT', numeric: true }
        ],
        'TON_KHO': [
            { label: 'Loại hàng hóa' }, { label: 'Mã hàng hóa' }, { label: 'Tên hàng hóa' },
            { label: 'SL có thể đặt', numeric: true }, { label: 'SL đã đặt chưa giao', numeric: true },
            { label: 'Số lượng tồn tối thiểu', numeric: true }, { label: 'Số lượng tồn', numeric: true },
            { label: 'Đơn giá bán 1', numeric: true }, { label: 'Đơn giá bán sàn', numeric: true },
            { label: 'Giá trị tồn kho', numeric: true }, { label: 'Đơn vị tính' }
        ]
    };

    var currentMode = 'NHAP_KHO'; 
    var globalRawData = [];  
    var filteredData = []; 
    var currentPage = 1;
    var pageSize = 50;

    document.addEventListener("DOMContentLoaded", function() {
        renderTableHeader();
        loadDataFromSheet();
    });

    function showLoading(show, text) {
        var spinner = document.getElementById('loadingSpinner');
        var spinnerText = document.getElementById('spinnerText');
        if (text) spinnerText.innerText = text;
        spinner.style.display = show ? 'flex' : 'none';
    }

    function switchTableMode(mode) {
        if (currentMode === mode) return;
        currentMode = mode;

        var btnNhapKho = document.getElementById('btnModeNhapKho');
        var btnLaptop = document.getElementById('btnModeLaptop');
        var btnPc = document.getElementById('btnModePc');
        var btnTonKho = document.getElementById('btnModeTonKho');
        var desc = document.getElementById('modeDescription');

        btnNhapKho.className = 'btn btn-outline-primary';
        btnLaptop.className = 'btn btn-outline-warning';
        btnPc.className = 'btn btn-outline-dark';
        btnTonKho.className = 'btn btn-outline-info';

        if (mode === 'NHAP_KHO') {
            btnNhapKho.className = 'btn btn-primary active';
            desc.innerText = 'Đang hiển thị Trang tính: NHẬP KHO (17 Cột)';
        } else if (mode === 'LAPTOP') {
            btnLaptop.className = 'btn btn-warning active';
            desc.innerText = 'Đang hiển thị Trang tính: LAPTOP (30 Cột)';
        } else if (mode === 'PC') {
            btnPc.className = 'btn btn-dark active';
            desc.innerText = 'Đang hiển thị Trang tính: PC (27 Cột)';
        } else if (mode === 'TON_KHO') {
            btnTonKho.className = 'btn btn-info active text-white';
            desc.innerText = 'Đang hiển thị Trang tính: TỒN KHO (11 Cột)';
        }

        renderTableHeader();
        loadDataFromSheet();
    }

    function getActiveColumns() {
        return SHEET_CONFIGS[currentMode] || SHEET_CONFIGS['NHAP_KHO'];
    }

    function renderTableHeader() {
        var activeCols = getActiveColumns();
        var thead = document.getElementById('tableHeader');
        
        var headerHtml = `<tr><th class="text-center" style="width: 70px;">Thao Tác</th>`;
        var filterRowHtml = `<tr class="bg-light"><td class="text-center"><i class="fa-solid fa-filter text-muted"></i></td>`;

        activeCols.forEach((col, colIndex) => {
            var customClass = col.numeric ? 'text-right' : '';
            if (col.ncc) customClass += ' col-ncc';
            if (col.code) customClass += ' col-code';
            if (col.desc) customClass += ' col-desc';

            headerHtml += `<th class="${customClass.trim()}">${col.label}</th>`;
            filterRowHtml += `<td class="${customClass.trim()}"><input type="text" class="filter-input col-filter" data-col-index="${colIndex}" onkeyup="applyFilters()" placeholder="Lọc..."></td>`;
        });

        headerHtml += `</tr>`;
        filterRowHtml += `</tr>`;

        thead.innerHTML = headerHtml + filterRowHtml;
    }

    function formatNumberVN(val) {
        if (val === '' || val === null || val === undefined) return '';
        var num = Number(val);
        if (isNaN(num)) return val;
        return num.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
    }

    function formatDateVN(val) {
        if (!val) return '';
        var str = String(val).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes('-')) {
            var parts = str.split('-');
            if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return str;
    }

    function loadDataFromSheet() {
        showLoading(true, `Đang tải dữ liệu từ Trang tính '${currentMode}'...`);

        var oldScript = document.getElementById('jsonp_script');
        if (oldScript) oldScript.remove();

        var script = document.createElement('script');
        script.id = 'jsonp_script';
        script.src = `${GOOGLE_SCRIPT_URL}?sheetName=${encodeURIComponent(currentMode)}&callback=handleSheetResponse&_t=${new Date().getTime()}`;
        
        script.onerror = function() {
            showLoading(false);
            alert(`Lỗi kết nối Google Sheets! Vui lòng đảm bảo bạn đã cấp quyền 'Anyone' trong Apps Script.`);
        };

        document.body.appendChild(script);
    }

    window.handleSheetResponse = function(data) {
        showLoading(false);
        if (data && data.result === "success") {
            globalRawData = data.data || [];
            applyFilters();
        } else {
            alert("Lỗi nạp dữ liệu: " + (data ? data.error : "Không xác định"));
        }
    };

    function applyFilters() {
        var globalKeyword = document.getElementById('globalSearchInput').value.toLowerCase().trim();
        var fromDate = document.getElementById('fromDateInput').value;
        var toDate = document.getElementById('toDateInput').value;
        var nccKeyword = document.getElementById('nccFilterInput').value.toLowerCase().trim();

        var activeCols = getActiveColumns();
        var colFilters = {};
        document.querySelectorAll('.col-filter').forEach(input => {
            var colIdx = input.getAttribute('data-col-index');
            var val = input.value.toLowerCase().trim();
            if (val) colFilters[colIdx] = val;
        });

        filteredData = [];

        globalRawData.forEach((row, originalIndex) => {
            var isVisible = true;

            if (globalKeyword && isVisible) {
                var rowText = row.join(' ').toLowerCase();
                if (!rowText.includes(globalKeyword)) isVisible = false;
            }

            // Lọc theo khoảng ngày nếu trang tính có cột Ngày (cột đầu tiên)
            if (isVisible && (fromDate || toDate) && activeCols[0] && activeCols[0].date) {
                var rowDate = row[0] ? String(row[0]).split('T')[0] : '';
                if (fromDate && rowDate < fromDate) isVisible = false;
                if (toDate && rowDate > toDate) isVisible = false;
            }

            if (isVisible && nccKeyword) {
                var rowText = row.join(' ').toLowerCase();
                if (!rowText.includes(nccKeyword)) isVisible = false;
            }

            if (isVisible) {
                for (var idx in colFilters) {
                    var cellVal = row[idx] !== undefined ? String(row[idx]).toLowerCase() : '';
                    if (!cellVal.includes(colFilters[idx])) {
                        isVisible = false;
                        break;
                    }
                }
            }

            if (isVisible) {
                filteredData.push({ rowData: row, originalIndex: originalIndex });
            }
        });

        currentPage = 1;
        renderTablePage();
    }

    function resetFilters() {
        document.getElementById('globalSearchInput').value = '';
        document.getElementById('fromDateInput').value = '';
        document.getElementById('toDateInput').value = '';
        document.getElementById('nccFilterInput').value = '';
        document.querySelectorAll('.col-filter').forEach(i => i.value = '');
        applyFilters();
    }

    function renderTablePage() {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        var totalItems = filteredData.length;
        var activeCols = getActiveColumns();

        if (totalItems === 0) {
            tbody.innerHTML = `<tr><td colspan="${activeCols.length + 1}" class="text-center text-muted py-4">Sheet <strong>${currentMode}</strong> chưa có dữ liệu phù hợp. Nhấn <strong>'Thêm Dòng Mới'</strong> hoặc <strong>'Nhập Từ Excel'</strong>.</td></tr>`;
            document.getElementById('rowCountBadge').innerText = `Hiển thị: 0 / 0 dòng`;
            document.getElementById('pageInfoSpan').innerText = `Trang 0 / 0`;
            renderPaginationControls(0);
            renderTableFooter([]);
            return;
        }

        var totalPages = Math.ceil(totalItems / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        var startIndex = (currentPage - 1) * pageSize;
        var endIndex = Math.min(startIndex + pageSize, totalItems);

        for (var i = startIndex; i < endIndex; i++) {
            var item = filteredData[i];
            appendRowToTable(item.rowData, item.originalIndex, activeCols);
        }

        document.getElementById('rowCountBadge').innerText = `Hiển thị: ${totalItems} / ${globalRawData.length} dòng`;
        document.getElementById('pageInfoSpan').innerText = `Trang ${currentPage} / ${totalPages} (Từ dòng ${startIndex + 1} - ${endIndex})`;

        renderPaginationControls(totalPages);
        renderTableFooter(filteredData.map(item => item.rowData));
    }

    function appendRowToTable(rowData, originalIndex, activeCols) {
        var tbody = document.getElementById('tableBody');
        var tr = document.createElement('tr');
        
        var sheetRowIndex = originalIndex + 2;
        tr.setAttribute('data-sheet-row', sheetRowIndex);

        var actionTd = `<td class="text-center">
            <button class="btn btn-sm btn-outline-warning btn-edit py-0 px-2" onclick="editRow(this)" title="Chỉnh sửa"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="btn btn-sm btn-success btn-save py-0 px-2" onclick="saveRow(this)" style="display:none;" title="Lưu"><i class="fa-solid fa-floppy-disk"></i></button>
        </td>`;

        var cellsHtml = actionTd;

        activeCols.forEach((col, colIdx) => {
            var val = (rowData && rowData[colIdx] !== undefined) ? rowData[colIdx] : '';
            var displayVal = val;
            var customClass = col.numeric ? "text-right" : "";
            if (col.ncc) customClass += " col-ncc";
            if (col.code) customClass += " col-code";
            if (col.desc) customClass += " col-desc";

            if (col.date) {
                displayVal = formatDateVN(val);
            } else if (col.numeric) {
                displayVal = formatNumberVN(val);
            }

            cellsHtml += `<td class="${customClass.trim()}" data-col-idx="${colIdx}" data-raw-val="${val}">${displayVal}</td>`;
        });

        tr.innerHTML = cellsHtml;
        tbody.appendChild(tr);
    }

    function renderTableFooter(visibleRows) {
        var activeCols = getActiveColumns();
        var tfoot = document.getElementById('tableFooter');
        
        if (!visibleRows || visibleRows.length === 0) {
            tfoot.innerHTML = '';
            return;
        }

        var firstNumericIndex = activeCols.findIndex(c => c.numeric);
        if (firstNumericIndex === -1) {
            tfoot.innerHTML = '';
            return;
        }

        var labelColspan = firstNumericIndex + 1; // +1 tính cột Thao Tác

        var footerHtml = `<tr><td class="text-center fw-bold" colspan="${labelColspan}">TỔNG CỘNG (ĐANG HIỂN THỊ):</td>`;

        for (var i = firstNumericIndex; i < activeCols.length; i++) {
            var col = activeCols[i];
            if (col.numeric) {
                var sum = 0;
                visibleRows.forEach(row => {
                    var val = parseFloat(row[i]);
                    if (!isNaN(val)) sum += val;
                });
                footerHtml += `<td class="text-right fw-bold">${formatNumberVN(sum)}</td>`;
            } else {
                footerHtml += `<td></td>`;
            }
        }

        footerHtml += `</tr>`;
        tfoot.innerHTML = footerHtml;
    }

    function renderPaginationControls(totalPages) {
        var container = document.getElementById('paginationControls');
        container.innerHTML = '';
        if (totalPages <= 1) return;

        container.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(1); return false;"><i class="fa-solid fa-angles-left"></i></a>
        </li>`;
        container.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;"><i class="fa-solid fa-angle-left"></i></a>
        </li>`;

        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

        for (var p = startPage; p <= endPage; p++) {
            container.innerHTML += `<li class="page-item ${p === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="goToPage(${p}); return false;">${p}</a>
            </li>`;
        }

        container.innerHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;"><i class="fa-solid fa-angle-right"></i></a>
        </li>`;
        container.innerHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${totalPages}); return false;"><i class="fa-solid fa-angles-right"></i></a>
        </li>`;
    }

    function goToPage(page) {
        currentPage = page;
        renderTablePage();
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        currentPage = 1;
        renderTablePage();
    }

    function editRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var activeCols = getActiveColumns();

        for (var i = 1; i < cells.length; i++) {
            var colIdx = i - 1;
            var colConfig = activeCols[colIdx];
            var rawVal = cells[i].getAttribute('data-raw-val') || cells[i].innerText.trim();

            if (colConfig && colConfig.date) {
                cells[i].innerHTML = `<input type="date" class="editable-input" value="${rawVal}">`;
            } else {
                cells[i].innerHTML = `<input type="text" class="editable-input" value="${rawVal}">`;
            }
        }

        tr.querySelector('.btn-edit').style.display = 'none';
        tr.querySelector('.btn-save').style.display = 'inline-block';
    }

    function saveRow(btn) {
        var tr = btn.closest('tr');
        var cells = tr.querySelectorAll('td');
        var sheetRowIndex = parseInt(tr.getAttribute('data-sheet-row'));

        var fullRowData = [];
        for (var i = 1; i < cells.length; i++) {
            var input = cells[i].querySelector('input');
            var val = input ? input.value.trim() : cells[i].innerText.trim();
            fullRowData.push(val);
        }

        showLoading(true, `Đang ghi dữ liệu vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "updateRow",
            sheetName: currentMode,
            rowIndex: sheetRowIndex,
            rowData: fullRowData
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                alert("Đã lưu dữ liệu thành công!");
                loadDataFromSheet();
            }, 1200);
        })
        .catch(err => {
            showLoading(false);
            alert("Lỗi lưu dữ liệu!");
        });
    }

    function addRow() {
        var activeCols = getActiveColumns();
        var emptyRow = new Array(activeCols.length).fill('');

        showLoading(true, `Đang thêm dòng mới vào Sheet '${currentMode}'...`);

        var formData = new URLSearchParams();
        formData.append("payload", JSON.stringify({
            action: "appendRows",
            sheetName: currentMode,
            rows: [emptyRow]
        }));

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        })
        .then(() => {
            setTimeout(() => {
                showLoading(false);
                loadDataFromSheet();
            }, 1200);
        });
    }

    function handleExcelUpload(event) {
        var file = event.target.files[0];
        if (!file) return;

        var activeCols = getActiveColumns();

        var reader = new FileReader();
        reader.onload = async function(e) {
            var data = new Uint8Array(e.target.result);
            var workbook = XLSX.read(data, { type: 'array' });
            var worksheet = workbook.Sheets[workbook.SheetNames[0]];
            var excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            var rawRows = excelData.slice(1).filter(r => r.length > 0 && r.some(cell => cell !== null && cell !== ''));

            if (rawRows.length === 0) {
                alert("File Excel không chứa dữ liệu!");
                return;
            }

            var formattedRows = rawRows.map(row => {
                var newRow = [];
                for (var i = 0; i < activeCols.length; i++) {
                    var cellVal = row[i] !== undefined && row[i] !== null ? row[i] : '';
                    newRow.push(String(cellVal));
                }
                return newRow;
            });

            var BATCH_SIZE = 100;
            var totalRows = formattedRows.length;

            showLoading(true, `Đang đẩy ${totalRows} dòng vào Sheet '${currentMode}'...`);

            for (var i = 0; i < totalRows; i += BATCH_SIZE) {
                var chunk = formattedRows.slice(i, i + BATCH_SIZE);
                var formData = new URLSearchParams();
                formData.append("payload", JSON.stringify({
                    action: "appendRows",
                    sheetName: currentMode,
                    rows: chunk
                }));

                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData.toString()
                    });
                } catch (err) {}
            }

            setTimeout(() => {
                showLoading(false);
                alert(`Đã hoàn tất tải lên file Excel vào Sheet '${currentMode}'!`);
                loadDataFromSheet();
            }, 1500);

            event.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    }
</script>
